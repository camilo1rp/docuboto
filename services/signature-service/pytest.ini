[pytest]
asyncio_mode = auto
addopts = --timeout=60 --timeout-method=thread
markers =
    nivel_vigente_real: usa la relectura REAL del nivel bajo bloqueo (B9-2); por defecto se neutraliza para no alterar las secuencias de mocks
    lectura_vigente_real: usa la lectura REAL con max(copia, nivel vivo) (B9-S1); por defecto se neutraliza para no alterar las secuencias de mocks
