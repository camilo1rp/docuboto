[pytest]
asyncio_mode = auto
# CI unitario corre en el checkout: `document.api` vive en document-service.
# En el contenedor split, `.` ya cubre `/app/document`.
pythonpath = . ../document-service
testpaths = tests
addopts = --timeout=60 --timeout-method=thread
markers =
    integration: requires RUN_INTEGRATION=1 and a live Postgres (tests/integration/, see CLAUDE.md)
