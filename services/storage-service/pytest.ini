[pytest]
asyncio_mode = auto
testpaths = tests
addopts = --timeout=60 --timeout-method=thread
markers =
    integration: requires RUN_INTEGRATION=1 and a live Postgres (tests/integration/, see CLAUDE.md)
    con_precheck_real: no neutralizar StorageService.verificar_sin_citas (C-5/C14, test_purga_disposicion_endpoint)
