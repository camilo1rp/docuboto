[pytest]
# Un proceso, una configuración (ADR-047). CI corre cada `tests/<dominio>/` en
# su propia invocación: los conftest de dominio fijan variables de entorno y
# neutralizan piezas de su propio dominio, y mezclarlos en una sesión haría que
# el orden de recolección decidiera el resultado.
asyncio_mode = auto
addopts = --timeout=60 --timeout-method=thread
pythonpath = .
markers =
    integration: tier contra Postgres real (RUN_INTEGRATION=1)
    gates_reales: usa los gates de bandera y permiso de ADR-037 sin abrirlos (tests/<dominio>/conftest.py)
    con_precheck_real: no neutralizar StorageService.verificar_sin_citas (C-5/C14, test_purga_disposicion_endpoint)
    derivacion_real: usa la derivación real de datos mínimos del borrador (AREA-09-02)
    lectura_vigente_real: usa la lectura REAL con max(copia, nivel vivo) (B9-S1); por defecto se neutraliza para no alterar las secuencias de mocks
    nivel_vigente_real: usa la relectura REAL del nivel bajo bloqueo (B9-2); por defecto se neutraliza para no alterar las secuencias de mocks
