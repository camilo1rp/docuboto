  mcp-server:
    # Capa MCP (E18): fachada cliente del api-gateway. Sin BD/Redis/MinIO.
    build:
      # Contexto en la RAÍZ: el Dockerfile instala shared/orpycamcp_common
      # (ADR-010), que NO existe dentro de services/mcp-server/. Cambió al
      # añadirse el gate de escritura, cuya comprobación de secretos al arrancar
      # vive en la librería compartida.
      context: ..
      dockerfile: services/mcp-server/Dockerfile
    container_name: orpycamcp-mcp-server-prod
    restart: unless-stopped
    environment:
      GATEWAY_URL: http://api-gateway:8080
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # `:?` aborta el despliegue si falta: sin clave de firma el gate de
      # escritura del MCP sería decorativo, y un control decorativo es peor que
      # ninguno porque nadie lo revisa. Debe respaldarse con la misma disciplina
      # que el resto de secretos (ver .env.example).
      MCP_PROPOSAL_SECRET: ${MCP_PROPOSAL_SECRET:?MCP_PROPOSAL_SECRET es obligatorio}
      MCP_PROPOSAL_SECRET_PREVIOUS: ${MCP_PROPOSAL_SECRET_PREVIOUS:-}
    networks:
      - orpycamcp-net
    expose:
      - "8009"
    depends_on:
      - api-gateway
    # Era el único servicio de aplicación SIN healthcheck: si el proceso moría,
    # el contenedor seguía "arriba" y el asistente conversacional simplemente no
    # respondía, sin que el orquestador lo reiniciara.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8009/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    # SvelteKit SSR (adapter-node) detrás del reverse proxy/TLS. Split de URLs:
    #   - PUBLIC_* → orígenes públicos HTTPS que ve el NAVEGADOR (login PKCE, logout)
    #   - INTERNAL_* → cómo alcanza el SSR al gateway dentro de la red Docker
    # ORIGIN + PROTOCOL_HEADER/HOST_HEADER son IMPRESCINDIBLES tras un proxy: sin
    # ellos adapter-node deriva mal `url.origin` y arma un redirect_uri inválido.
    build:
      context: ../frontend
      dockerfile: Dockerfile
    # Sin container_name fijo: escala (deploy.replicas) → nombres únicos por réplica.
    restart: unless-stopped
    environment:
      PORT: "3000"
      # adapter-node limita el cuerpo a 512 KB por defecto y las subidas de anexos
      # pasan por el SSR: sin esto, todo PDF escaneado real muere en 413. Coincide
      # con el tope del gateway (MAX_REQUEST_BODY_BYTES) — subirlo aquí sin el
      # flujo por trozos del gateway cambiaría el 413 por un OOM.
      BODY_SIZE_LIMIT: "536870912"
      # Sin esto el SSR ve la IP del proxy, no la del navegador, y todo el tráfico
      # comparte un único cubo de limitación de tasa (ver Dockerfile del frontend).
      ADDRESS_HEADER: x-forwarded-for
      XFF_DEPTH: "1"
      ORIGIN: https://${FRONTEND_HOSTNAME:?Frontend hostname required}
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      # Públicas (navegador): gateway y Keycloak por su dominio público HTTPS.
      PUBLIC_API_URL: https://${API_PUBLIC_HOSTNAME:?Public API hostname required}
      PUBLIC_KEYCLOAK_URL: https://${KEYCLOAK_HOSTNAME}
      # Internas (SSR): el gateway por la red Docker; Keycloak por su hostname
      # público (hostname-strict=true + TLS solo aceptan el dominio del cert).
      INTERNAL_API_URL: http://api-gateway:8080
      INTERNAL_KEYCLOAK_URL: https://${KEYCLOAK_HOSTNAME}
    networks:
      - orpycamcp-net
    # Tras reverse proxy: no publicar el puerto, solo exponerlo a la red interna.
    expose:
      - "3000"
    depends_on:
      - api-gateway
      - keycloak
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
