name: orpyca-mcp

# Pasarela en la red ppi (ADR-045 §8). El fragmento NO se incluye aquí: Compose
# lo mezclaría siempre y `up` exigiría la red aunque no uses la pasarela.
# No define servicios. Activarlo:
#   docker network create --internal ppi
#   PPI_PROVIDER_URL=http://host:puerto docker compose \
#     -f infra/docker-compose.prod.yml -f infra/docker-compose.intelligence.yml up -d

# OrpycaMCP — Docker Compose (Production)
#
# SECURITY CHECKLIST before deploy:
# ✓ All credentials from environment variables (.env file)
# ✓ PostgreSQL backup strategy configured
# ✓ MinIO access logs enabled
# ✓ TLS certificates installed for the public hostnames
# ✓ Redis persistence enabled (RDB or AOF)
# ✓ All services have resource limits
# ✓ External logging configured (ELK, Datadog, etc.)
# ✓ Network isolation (internal services on private network)

networks:
  orpycamcp-net:
    driver: bridge
    # In production, consider using custom driver with encryption
    # El `gateway` (172.20.0.1) queda FUERA de `ip_range`: los contenedores reciben
    # IP solo de 172.20.128.0/17, y `TRUSTED_PROXIES` confía únicamente en ese rango.
    # Así, si un cliente llega al `edge` con la IP del gateway de la red (IPv6 servido
    # por docker-proxy, o un proceso del anfitrión), la app NO la salta
    # como «salto de confianza» y se queda con ella, en vez de con una entrada de
    # `X-Forwarded-For` forjada por el cliente (ADR-033; ADR-031 por el sello en
    # `audit_log`).
    ipam:
      config:
        - subnet: 172.20.0.0/16
          ip_range: 172.20.128.0/17
          gateway: 172.20.0.1

  # Optional: separated network for database if using RDS/managed DB
  # postgres-net:
  #   driver: bridge

volumes:
  postgres-data:
    # In production, use named volumes on persistent storage
    # E.g., AWS EBS, Google Persistent Disk, etc.
  # `minio-data` se conserva DECLARADO aunque ya no lo monte nadie: en un
  # despliegue real guarda el fondo del motor anterior, y bajo Object-Lock en
  # COMPLIANCE sus objetos NO se pueden borrar ni reescribir. Retirarlo es una
  # decisión de la entidad, después de migrar y con acta.
  minio-data:
  objectstore-data:
  redis-data:

# Migraciones al arrancar (AREA-13-08, ADR-053). Todo servicio espera a
# `migrate-docuboto`, el único migrador (imagen `app`,
# `command: python migrations/runner.py`, conexión del propietario). Si la
# migración falla, el servicio no arranca (`service_completed_successfully`,
# fail-closed). El runner es idempotente y se serializa con
# `scripts/init_tenant.py` por UN cerrojo global:
# `orpycamcp_common.migrations.cerrojo` (`pg_try_advisory_lock`, plazo
# `MIGRATIONS_LOCK_TIMEOUT_S`, 600 s por defecto; si vence, el migrador sale con
# error y el servicio no arranca; C19, ADR-041). Repetir `up -d` o escalar
# réplicas es seguro.
x-migracion: &migracion
  restart: "no"
  command: ["python", "migrations/runner.py"]
  # Sin esta línea el migrador caía en la red `default`, donde `postgres` no
  # está: el runner no resolvía el host, ninguna migración terminaba y, como cada
  # servicio espera `service_completed_successfully`, no arrancaba ninguno.
  networks:
    - orpycamcp-net
  depends_on:
    postgres:
      condition: service_healthy
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:

  # ─── Infrastructure ───────────────────────────────────────────────────────────

  postgres:
    # PostgreSQL a secas desde D0 (ADR-046 §4): ningún servicio usa pgvector.
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    container_name: orpycamcp-postgres-prod
    restart: unless-stopped
    # ── Presupuesto de conexiones ──────────────────────────────────────────
    #
    # Postgres trae `max_connections=100` por defecto. Este despliegue (una
    # entidad, un proceso, ADR-047) abre un pool de `DB_POOL_MAX_SIZE=10`
    # conexiones para la app.
    #
    # La identidad la emite la propia app (ADR-048): no hay otro pool contra
    # este Postgres. Queda margen para migraciones, respaldos y `psql`.
    #
    # Se deja `max_connections=300`. Bajar el cupo del servidor es otro cambio:
    # el monolito de Docuboto 2.0 pasa a un solo pool, y esa es la cuenta que
    # debe cuadrar el tope.
    #
    # `shared_buffers` acompaña porque cada conexión reserva memoria de trabajo.
    command: >
      postgres
      -c max_connections=300
      -c shared_buffers=512MB
    environment:
      POSTGRES_USER: ${DB_USER:?Database user required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password required}
      POSTGRES_DB: ${DB_NAME:?Database name required}
    # SECURITY: Don't expose database port externally
    # Only internal services access this
    networks:
      - orpycamcp-net
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Optional: database backup script
      # - ./infra/postgres/backup.sh:/usr/local/bin/backup.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    container_name: orpycamcp-redis-prod
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Redis password required}
    networks:
      - orpycamcp-net
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    # RustFS, no MinIO. Tag FIJO y con digest, no `latest`: aquí vive el
    # Object-Lock en modo COMPLIANCE, donde una retención mal aplicada es
    # IRREVERSIBLE durante décadas. Que la imagen cambie sola en el siguiente
    # `pull` —con el comportamiento de retención que traiga esa versión— no es un
    # riesgo aceptable para el almacén de preservación. Actualizarla es un acto
    # deliberado, con su ensayo y con la batería de conformidad WORM de nuevo en
    # verde ANTES de desplegar.
    # Digest de esta versión (verificable con `docker image inspect`):
    #   sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    #
    # Por qué se cambió de motor: MinIO **archivó su proyecto de código abierto**
    # y retiró sus imágenes de todos los registros públicos —quay.io responde
    # `denied`, Docker Hub 404, el binario de dl.min.io 410 y el digest anotado
    # tampoco resuelve—. La lección, anotada aquí porque es donde más importa: un
    # registro público es un canal de distribución, **no un archivo**. Para un
    # almacén de preservación que debe durar décadas, la entidad debería guardar
    # su propia copia de la imagen (`docker save`) junto al resto de sus
    # instrumentos de recuperación.
    #
    # Por qué RustFS: lo decidió una batería de conformidad WORM contra el
    # almacén REAL (`services/docuboto/tests/storage/integration/
    # test_worm_object_lock_real_s3.py`). Medido: RustFS 1.0.0 **7/7**, MinIO
    # **7/7** (línea base), Garage **0/7** (control negativo). Las siete pruebas
    # incluyen borrar la versión retenida con credencial RAÍZ, que es lo que
    # distingue COMPLIANCE de GOVERNANCE y lo que el Ac. AGN 001/2024
    # art. 4.3.2.4 P1 exige para el verbo «eliminados».
    #
    # Las variables `MINIO_*` de los demás servicios NO cambian: son el contrato
    # interno del cliente S3. Léanse como «el almacén de objetos».
    image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    container_name: orpycamcp-minio-prod
    restart: unless-stopped
    environment:
      # Mismos nombres de variable que antes —el operador no tiene que rehacer su
      # `.env`— y misma exigencia: sin secreto, el servicio no arranca.
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:?usuario raíz del almacén de objetos requerido}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?clave raíz del almacén de objetos requerida}
      RUSTFS_VOLUMES: /data
    networks:
      - orpycamcp-net
    volumes:
      # Volumen nuevo: la compatibilidad on-disk de RustFS con MinIO la marcan sus
      # propios autores como preview, así que NO se reinterpreta el fondo
      # existente. En un despliegue con datos reales esto exige una migración
      # explícita (`mc mirror` u homólogo) y re-sellar la retención, que es una
      # decisión de la entidad y no un efecto colateral de un `up -d`.
      - objectstore-data:/data
    # SECURITY: Only expose the S3 API to the internal network.
    # Use a reverse proxy (Nginx) for external access.
    expose:
      - "9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  app:
    # Proceso unificado Docuboto 2.0. Imagen publicada por `release.yml` en cada
    # tag X.Y.Z y fijada por digest en `release-<versión>.yml`. Un proceso (ADR-047): los
    # nueve paquetes de dominio, sus bucles de fondo y los consumidores de eventos.
    image: ${ORPYCA_REGISTRY:?Registro de imágenes requerido (p. ej. ghcr.io/camilo1rp/docuboto)}/app:${ORPYCA_VERSION:?Versión requerida (un tag X.Y.Z; nunca latest)}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_APP_USER:?DB_APP_USER es obligatorio}:${DB_APP_PASSWORD:?DB_APP_PASSWORD es obligatorio}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      EVENT_SIGNING_SECRET: ${EVENT_SIGNING_SECRET:?EVENT_SIGNING_SECRET es obligatorio}
      APP_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.20.128.0/17}
      GATEWAY_RED_DOCKER_GATEWAY: 172.20.0.1
      ALTCHA_HMAC_KEY: ${ALTCHA_HMAC_KEY:?ALTCHA_HMAC_KEY es obligatorio}
      ALTCHA_TTL_SEGUNDOS: ${ALTCHA_TTL_SEGUNDOS:-300}
      ALTCHA_MAXNUMBER: ${ALTCHA_MAXNUMBER:-100000}
      TZ_RADICACION: ${TZ_RADICACION:-America/Bogota}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_USE_SSL: "false"
      PRESERVATION_ENABLED: "true"
      PRESERVATION_REPLICA_ENABLED: "true"
      MINIO_SECONDARY_ENDPOINT: ${MINIO_SECONDARY_ENDPOINT:?almacén de preservación fuera del servidor requerido}
      MINIO_SECONDARY_ACCESS_KEY: ${MINIO_SECONDARY_ACCESS_KEY:?clave de acceso del almacén de preservación requerida}
      MINIO_SECONDARY_SECRET_KEY: ${MINIO_SECONDARY_SECRET_KEY:?secreto del almacén de preservación requerido}
      MINIO_SECONDARY_USE_SSL: ${MINIO_SECONDARY_USE_SSL:-true}
      PDFA_PROFILE: ${PDFA_PROFILE:-2b}
      # Bucles que antes corrían en el `worker` (ADR-047): migración de formato,
      # renovación LTA y la cola pesada. Comparten HEAVY_JOBS_CONCURRENCY plazas.
      FORMAT_MIGRATION_ENABLED: ${FORMAT_MIGRATION_ENABLED:-true}
      HEAVY_JOBS_CONCURRENCY: ${HEAVY_JOBS_CONCURRENCY:-1}
      # Emisor de identidad (ADR-048): `iss` y descubrimiento OIDC en la URL
      # pública del API; la clave sella los pares de firma de los JWT.
      IDENTITY_ISSUER: https://${API_PUBLIC_HOSTNAME:?Public API hostname required}
      IDENTITY_KEY_ENCRYPTION_KEY: ${IDENTITY_KEY_ENCRYPTION_KEY:?Identity key encryption key required (openssl rand -base64 32)}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?TOTP encryption key required (openssl rand -base64 32)}
      SIGNING_KEY_ENCRYPTION_KEY: ${SIGNING_KEY_ENCRYPTION_KEY:?Signing key encryption key required (openssl rand -base64 32)}
      SIGNING_KEY_CA_USERS_CERT_PATH: /run/secrets/ca-users-public/ca-users.crt
      EMAIL_ENCRYPTION_KEY: ${EMAIL_ENCRYPTION_KEY:?EMAIL_ENCRYPTION_KEY es obligatorio}
      SMTP_HOST: ${SMTP_HOST:?SMTP host required}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?SMTP user required}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP password required}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:?From email required}
      SMTP_TLS: "true"
      WEBHOOK_SECRET_KEK: ${WEBHOOK_SECRET_KEK:?WEBHOOK_SECRET_KEK es obligatoria (openssl rand -base64 32)}
      WEBHOOK_SECRET_KEKS: ${WEBHOOK_SECRET_KEKS:-{}}
      WEBHOOK_SECRET_KEK_ACTIVE_VERSION: ${WEBHOOK_SECRET_KEK_ACTIVE_VERSION:-1}
      # Cifra el secreto del cliente de servicio de inteligencia. `init_tenant.py`
      # no da de alta una entidad sin ella (ADR-053 §5), con o sin el fragmento
      # intelligence: por eso va aquí y no en docker-compose.intelligence.yml.
      INTELLIGENCE_CREDENTIAL_KEK: ${INTELLIGENCE_CREDENTIAL_KEK:?INTELLIGENCE_CREDENTIAL_KEK es obligatoria (openssl rand -base64 32)}
      SIGNATURE_SECRET: ${SIGNATURE_SECRET:?Signature secret required}
      SIGNER_PROVIDER: ${SIGNER_PROVIDER:-xades_local}
      SIGNER_CERT_DIR: /run/secrets/signing
      SIGNER_TIMESTAMP_ENABLED: ${SIGNER_TIMESTAMP_ENABLED:-true}
      TSA_URL: ${TSA_URL:-}
      TSA_CERT_DIR: /run/secrets/tsa
      TSA_ESSCERTID_CORTE: ${TSA_ESSCERTID_CORTE:-2026-10-04T00:00:00Z}
      FIRMA_PERSONAL_REQUIRE_XADES: ${FIRMA_PERSONAL_REQUIRE_XADES:-off}
      SIGNER_LT_ENABLED: ${SIGNER_LT_ENABLED:-false}
      SIGNER_LT_REQUIRE: ${SIGNER_LT_REQUIRE:-false}
      SIGNER_OCSP_ENABLED: ${SIGNER_OCSP_ENABLED:-true}
      SIGNER_OCSP_REQUIRE: ${SIGNER_OCSP_REQUIRE:-false}
    volumes:
      - ../secrets/ca-users-public:/run/secrets/ca-users-public:ro
      - ../secrets/signing:/run/secrets/signing:ro
      - ../secrets/tsa:/run/secrets/tsa:ro
    networks:
      - orpycamcp-net
    expose:
      - "8000"
    depends_on:
      migrate-docuboto:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    # SvelteKit SSR (adapter-node) detrás del reverse proxy/TLS. Split de URLs:
    #   - PUBLIC_* → orígenes públicos HTTPS que ve el NAVEGADOR
    #   - INTERNAL_* → cómo alcanza el SSR a la app dentro de la red Docker
    # ORIGIN + PROTOCOL_HEADER/HOST_HEADER son IMPRESCINDIBLES tras un proxy: sin
    # ellos adapter-node deriva mal `url.origin` y rechaza el formulario de login
    # por CSRF.
    # Imagen publicada por `release.yml` en cada tag X.Y.Z; en producción corre
    # `release-<versión>.yml`, que la fija por digest (ADR-053 §3).
    # Para construir en el propio servidor: infra/docker-compose.build.yml.
    image: ${ORPYCA_REGISTRY:?Registro de imágenes requerido (p. ej. ghcr.io/camilo1rp/docuboto)}/frontend:${ORPYCA_VERSION:?Versión requerida (un tag X.Y.Z; nunca latest)}
    # Una réplica. Sin container_name fijo, Compose nombra el contenedor.
    restart: unless-stopped
    environment:
      PORT: "3000"
      # adapter-node limita el cuerpo a 512 KB por defecto y las subidas de anexos
      # pasan por el SSR: sin esto, todo PDF escaneado real muere en 413. Coincide
      # con `client_max_body_size` de `edge` (512 MiB).
      BODY_SIZE_LIMIT: "536870912"
      # Sin esto el SSR ve la IP del proxy, no la del navegador, y todo el tráfico
      # comparte un único cubo de limitación de tasa (ver Dockerfile del frontend).
      ADDRESS_HEADER: x-forwarded-for
      XFF_DEPTH: "1"
      ORIGIN: https://${FRONTEND_HOSTNAME:?Frontend hostname required}
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      # Pública (navegador): la app por su dominio público HTTPS.
      PUBLIC_API_URL: https://${API_PUBLIC_HOSTNAME:?Public API hostname required}
      # Interna (SSR): la app por la red Docker.
      INTERNAL_API_URL: http://app:8000
    networks:
      - orpycamcp-net
    # Tras reverse proxy: no publicar el puerto, solo exponerlo a la red interna.
    expose:
      - "3000"
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Entrada de producción (ADR-033) ───────────────────────────────────────────
  # ÚNICO servicio que publica puertos. nginx corre en contenedor y no en el
  # anfitrión porque con nginx en el anfitrión la app vería como par a la IP
  # del docker-proxy, y porque `edge` lleva los dos hostnames públicos como
  # alias en `orpycamcp-net`: dentro de la red resuelven a este mismo servicio,
  # con certificado válido, sin hairpin NAT ni DNS externo.
  edge:
    image: nginx:1.30-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    restart: unless-stopped
    environment:
      FRONTEND_HOSTNAME: ${FRONTEND_HOSTNAME:?Frontend hostname required}
      API_PUBLIC_HOSTNAME: ${API_PUBLIC_HOSTNAME:?Public API hostname required}
      # La imagen solo sustituye estas variables en la plantilla: así los `$host`,
      # `$remote_addr`... de nginx llegan intactos.
      NGINX_ENVSUBST_FILTER: ^(FRONTEND|API_PUBLIC)_HOSTNAME$$
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/orpyca.conf.template:/etc/nginx/templates/orpyca.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot-www:/var/www/certbot:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /etc/nginx/conf.d
    networks:
      orpycamcp-net:
        aliases:
          - ${FRONTEND_HOSTNAME}
          - ${API_PUBLIC_HOSTNAME}
    depends_on:
      - frontend
      - app
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Migraciones (un contenedor de un solo uso) ───
  migrate-docuboto:
    <<: *migracion
    image: ${ORPYCA_REGISTRY:?Registro de imágenes requerido (p. ej. ghcr.io/camilo1rp/docuboto)}/app:${ORPYCA_VERSION:?Versión requerida (un tag X.Y.Z; nunca latest)}
    environment:
      MIGRATIONS_DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}

