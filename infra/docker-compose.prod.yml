name: orpyca-mcp

# OrpycaMCP — Docker Compose (Production)
#
# SECURITY CHECKLIST before deploy:
# ✓ All credentials from environment variables (.env file)
# ✓ PostgreSQL backup strategy configured
# ✓ MinIO access logs enabled
# ✓ Keycloak TLS certificate installed
# ✓ Redis persistence enabled (RDB or AOF)
# ✓ All services have resource limits
# ✓ External logging configured (ELK, Datadog, etc.)
# ✓ Network isolation (internal services on private network)

networks:
  orpycamcp-net:
    driver: bridge
    # In production, consider using custom driver with encryption
    ipam:
      config:
        - subnet: 172.20.0.0/16

  # Optional: separated network for database if using RDS/managed DB
  # postgres-net:
  #   driver: bridge

volumes:
  postgres-data:
    # In production, use named volumes on persistent storage
    # E.g., AWS EBS, Google Persistent Disk, etc.
  minio-data:
  redis-data:
  # Keycloak uses external PostgreSQL, no separate volume

services:

  # ─── Infrastructure ───────────────────────────────────────────────────────────

  postgres:
    # pgvector, no postgres a secas: knowledge-service (E21) crea la extensión
    # `vector` en el init. Con la imagen base la extensión no existe y la
    # migración falla a mitad de la provisión del primer tenant.
    image: pgvector/pgvector:pg15
    container_name: orpycamcp-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?Database user required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password required}
      POSTGRES_DB: ${DB_NAME:?Database name required}
    # SECURITY: Don't expose database port externally
    # Only internal services access this
    networks:
      - orpycamcp-net
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # OJO con la ruta: este compose vive en infra/, el script en la raíz. Con
      # `./scripts/...` Docker no falla — crea un DIRECTORIO vacío y lo monta, así
      # que el init no corre y no existen ni el schema `keycloak` ni la extensión
      # `vector` ni public._migrations. El fallo aparece después, en Keycloak.
      - ../scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      # Optional: database backup script
      # - ./infra/postgres/backup.sh:/usr/local/bin/backup.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: orpycamcp-redis-prod
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Redis password required}
    networks:
      - orpycamcp-net
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    # Tag FIJO, no `latest`. Aquí vive el Object-Lock en modo COMPLIANCE, donde
    # una retención mal aplicada es IRREVERSIBLE durante décadas: que la imagen
    # cambie sola en el siguiente `pull` —con el comportamiento de retención que
    # traiga esa versión— no es un riesgo aceptable para el almacén de
    # preservación. Actualizarla pasa a ser un acto deliberado, con su ensayo.
    # Digest de esta versión (verificable con `docker image inspect`):
    #   sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: orpycamcp-minio-prod
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MinIO root user required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MinIO root password required}
      # Enable access logs for audit trail
      MINIO_LOG_QUERY_STRING: "on"
    networks:
      - orpycamcp-net
    volumes:
      - minio-data:/data
    # SECURITY: Only expose S3 API and console to internal network
    # Use a reverse proxy (Nginx) for external access
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: orpycamcp-keycloak-prod
    restart: unless-stopped
    command: start --db=postgres --hostname-strict=true --hostname=${KEYCLOAK_HOSTNAME:?Keycloak hostname required}
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      KC_DB_USERNAME: ${DB_USER}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KC_DB_SCHEMA: keycloak
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:?Keycloak admin user required}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Keycloak admin password required}

      # TLS TERMINADO EN EL REVERSE PROXY (es el despliegue que documenta la guía
      # y el que asume el resto de este fichero: todos los servicios usan `expose:`,
      # ninguno publica puerto). Keycloak habla HTTP plano DENTRO de la red Docker
      # y confía en las cabeceras X-Forwarded-* del proxy.
      #
      # La configuración anterior (HTTPS_ENABLED=true + HTTP_ENABLED=false) con el
      # bloque de certificados comentado abajo hacía que el contenedor muriera al
      # arrancar con «Key material not provided» — y sin identidad no hay sistema.
      # Si terminas TLS AQUÍ en vez de en el proxy: invierte estas dos variables,
      # descomenta el montaje de certificados y añade KC_HTTPS_PORT: "8443".
      KC_HTTP_ENABLED: "true"
      KC_HTTPS_ENABLED: "false"
      KC_PROXY_HEADERS: xforwarded

      # Performance tuning
      # KC_CACHE_STACK solo aplica a clúster; `kubernetes` sobre Compose plano hace
      # que el descubrimiento JGroups falle. Con una sola instancia, `default` basta.
      KC_CACHE: local
    networks:
      - orpycamcp-net
    # Montajes opcionales (descomenta y añade `volumes:` como lista cuando los uses):
    # volumes:
    #   # Certificado TLS (si NO terminas TLS en el reverse proxy):
    #   - ./certs/tls.crt:/etc/x509/https/tls.crt:ro
    #   - ./certs/tls.key:/etc/x509/https/tls.key:ro
    #   # Realm de PRODUCCIÓN propio (NO reutilizar el realm-export.json de dev:
    #   # ese trae usuarios de prueba y redirectUris localhost). El realm de prod
    #   # debe tener redirectUris/webOrigins SOLO con https://app.yourdomain.com:
    #   - ./keycloak/realm-prod.json:/opt/keycloak/data/import/realm-prod.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3G
        reservations:
          cpus: '1'
          memory: 1.5G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Application Services ──────────────────────────────────────────────────────

  api-gateway:
    build:
      context: ../services/api-gateway
      dockerfile: Dockerfile
    # Sin container_name fijo: este servicio escala (deploy.replicas), los nombres
    # deben ser únicos por réplica (Compose los genera como proyecto-servicio-N).
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      KEYCLOAK_URL: https://${KEYCLOAK_HOSTNAME}
      KEYCLOAK_REALM: orpycamcp
      KEYCLOAK_CLIENT_ID: api-gateway
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_API_GATEWAY_SECRET:?API Gateway Keycloak secret required}
      TENANT_HEADER: X-Tenant-Slug
      # Intermediarios de CONFIANZA: solo se cree el `X-Forwarded-For` que
      # escriben ellos (ver services/api-gateway/app/core/client_ip.py). Sin
      # declararlos, la cabecera se ignora entera y todo el tráfico comparte la
      # IP del contenedor del SSR — que es el estado fail-closed, correcto pero
      # inservible para limitar por IP. Por defecto: la subred de esta red Docker,
      # donde viven el frontend SSR y el reverse proxy si corre en el mismo host.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.20.0.0/16}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - orpycamcp-net
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 2  # Scale horizontally
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  auth-service:
    build:
      # Contexto en la RAÍZ: el Dockerfile instala shared/orpycamcp_common (ADR-010),
      # que NO existe dentro de services/auth-service/.
      context: ..
      dockerfile: services/auth-service/Dockerfile
    container_name: orpycamcp-auth-service-prod
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      KEYCLOAK_URL: https://${KEYCLOAK_HOSTNAME}
      KEYCLOAK_REALM: orpycamcp
      KEYCLOAK_CLIENT_ID: auth-service
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_AUTH_SERVICE_SECRET:?Auth Service secret required}
      # ── Claves de cifrado en reposo (KEK) ────────────────────────────────────
      # Ambas son base64 de 32 bytes y son SECRETOS DISTINTOS con propósitos
      # distintos: TOTP_ENCRYPTION_KEY cifra el secreto TOTP del segundo factor,
      # SIGNING_KEY_ENCRYPTION_KEY envuelve la clave privada de firma personal.
      # Sin ellas los endpoints correspondientes fallan CERRADOS (500), que es lo
      # correcto — pero en producción eso significa «nadie enrola 2FA ni firma»,
      # así que se exigen con `:?` en vez de dejarlas vacías por defecto.
      # Generar: openssl rand -base64 32
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?TOTP encryption key required (openssl rand -base64 32)}
      SIGNING_KEY_ENCRYPTION_KEY: ${SIGNING_KEY_ENCRYPTION_KEY:?Signing key encryption key required (openssl rand -base64 32)}
      # Token servicio-a-servicio que protege POST /internal/signing-key/* — el
      # llamante es signature-service, que debe traer EXACTAMENTE este valor.
      SIGNING_KEY_INTERNAL_TOKEN: ${SIGNING_KEY_INTERNAL_TOKEN:?Signing key internal token required}
      # Certificado PÚBLICO de la sub-CA que emite las credenciales de usuario.
      # La clave privada (ca-users.key) NUNCA se monta aquí.
      SIGNING_KEY_CA_USERS_CERT_PATH: /run/secrets/ca-users-public/ca-users.crt
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # Solo material público, solo lectura.
      - ../secrets/ca-users-public:/run/secrets/ca-users-public:ro
    networks:
      - orpycamcp-net
    expose:
      - "8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  tenant-service:
    build:
      # Contexto en la RAÍZ: el Dockerfile instala shared/orpycamcp_common (ADR-010),
      # que NO existe dentro de services/tenant-service/.
      context: ..
      dockerfile: services/tenant-service/Dockerfile
    container_name: orpycamcp-tenant-service-prod
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - orpycamcp-net
    expose:
      - "8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  document-service:
    build:
      # Contexto en la RAÍZ: el Dockerfile instala shared/orpycamcp_common (ADR-010),
      # que NO existe dentro de services/document-service/.
      context: ..
      dockerfile: services/document-service/Dockerfile
    # Sin container_name fijo: escala (deploy.replicas) → nombres únicos por réplica.
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # D-02: secreto compartido con storage-service.INTERNAL_SERVICE_TOKEN.
      # document-service MEDIA la descarga de anexos (gate por clearance vigente)
      # y necesita este token para hablar con storage. Sin él, storage responde
      # 401 a TODA descarga — fail-closed correcto, sistema inservible.
      STORAGE_INTERNAL_TOKEN: ${STORAGE_INTERNAL_TOKEN:?Storage internal token required}
      # Token que protege los endpoints /internal de ESTE servicio (los consume
      # archive-service al ensamblar el AIP y el export del expediente).
      INTERNAL_SERVICE_TOKEN: ${DOCUMENT_INTERNAL_TOKEN:?Document internal token required}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - orpycamcp-net
    expose:
      - "8003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 2  # Scale horizontally for read load
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  storage-service:
    build:
      # Contexto en la RAÍZ (ADR-010, mismo motivo que signature-service más
      # abajo): el Dockerfile instala shared/orpycamcp_common, que NO existe
      # dentro de services/storage-service/ -- `context: ../services/storage-service`
      # (como estaba antes) rompería ese COPY. target=production (E10
      # Increment C2b) añade Java + veraPDF CLI real y corre como usuario
      # NO-root -- ver comentarios en services/storage-service/Dockerfile
      # para el detalle completo (la imagen de dev, target por defecto, se
      # mantiene slim, sin Java).
      context: ..
      dockerfile: services/storage-service/Dockerfile
      target: production
    # Sin container_name fijo: escala (deploy.replicas) → nombres únicos por réplica.
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      # El campo real es `minio_use_ssl` (core/config.py:24). `MINIO_SECURE` no
      # existe y `extra="ignore"` lo descartaba en silencio: la variable prometía
      # TLS sobre tráfico que iba en claro. Se deja en false porque el MinIO de
      # este compose no tiene certificados y el tráfico no sale de la red Docker;
      # ponerlo en true exige montarlos y configurar MinIO en modo TLS.
      MINIO_USE_SSL: "false"
      # Token que protege los endpoints internos de storage. Es el MISMO valor
      # que STORAGE_INTERNAL_TOKEN en document/archive/signature-service.
      INTERNAL_SERVICE_TOKEN: ${STORAGE_INTERNAL_TOKEN:?Storage internal token required}
      # WORM/Object-Lock (E10). Sin APP_ENV=production el resolutor exige modo
      # COMPLIANCE explícito; sin PRESERVATION_ENABLED el índice electrónico y el
      # acta de transferencia se cierran SIN protección y el trabajo de reintento
      # acumula backlog en silencio.
      APP_ENV: production
      PRESERVATION_ENABLED: "true"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # VERAPDF_BINARY/PDFA_VALIDATOR/PRESERVATION_PDFA_VALIDATION_ENABLED ya
      # vienen como ENV del stage "production" del Dockerfile (valores por
      # defecto correctos para este despliegue) -- se sobrescriben acá SOLO
      # si una instalación concreta necesita desviarse (p. ej. un perfil PDF/A
      # institucional distinto de "2b", ver PDFA_PROFILE en core/config.py).
      PDFA_PROFILE: ${PDFA_PROFILE:-2b}
    networks:
      - orpycamcp-net
    expose:
      - "8005"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 2  # Scale for file upload throughput
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  workflow-service:
    build:
      # Contexto en la RAÍZ: el Dockerfile instala shared/orpycamcp_common (ADR-010),
      # que NO existe dentro de services/workflow-service/.
      context: ..
      dockerfile: services/workflow-service/Dockerfile
    container_name: orpycamcp-workflow-service-prod
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - orpycamcp-net
    expose:
      - "8006"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  archive-service:
    build:
      # Contexto en la RAÍZ: el Dockerfile instala shared/orpycamcp_common (ADR-010),
      # que NO existe dentro de services/archive-service/.
      context: ..
      dockerfile: services/archive-service/Dockerfile
    container_name: orpycamcp-archive-service-prod
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # D-02, los tres pares emisor/receptor de este servicio:
      #  - storage:   AIP, protección WORM del índice y del acta
      #  - signature: POST /internal/sign-indice (reconciliación del sellado)
      #  - document:  export del expediente por-radicado con recorte de clearance
      STORAGE_INTERNAL_TOKEN: ${STORAGE_INTERNAL_TOKEN:?Storage internal token required}
      SIGNATURE_INTERNAL_TOKEN: ${SIGNATURE_INTERNAL_TOKEN:?Signature internal token required}
      DOCUMENT_INTERNAL_TOKEN: ${DOCUMENT_INTERNAL_TOKEN:?Document internal token required}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - orpycamcp-net
    expose:
      - "8004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  notification-service:
    build:
      # Contexto en la RAÍZ: el Dockerfile instala shared/orpycamcp_common (ADR-010),
      # que NO existe dentro de services/notification-service/.
      context: ..
      dockerfile: services/notification-service/Dockerfile
    container_name: orpycamcp-notification-service-prod
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SMTP_HOST: ${SMTP_HOST:?SMTP host required}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?SMTP user required}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP password required}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:?From email required}
      SMTP_TLS: "true"
      # D-02: POST /notifications/send está SELLADO servicio-a-servicio. Por ahí
      # sale el OTP del segundo factor; sin este token nadie con 2FA puede entrar.
      INTERNAL_SERVICE_TOKEN: ${NOTIFICATION_INTERNAL_TOKEN:?Notification internal token required}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - orpycamcp-net
    expose:
      - "8007"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8007/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  signature-service:
    # Firma electrónica (E06). Contexto raíz: el Dockerfile instala shared/orpycamcp_common (ADR-010).
    build:
      context: ..
      dockerfile: services/signature-service/Dockerfile
    container_name: orpycamcp-signature-service-prod
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      # En prod el navegador y los servicios usan el MISMO hostname público de
      # Keycloak (DNS real), así que el `iss` coincide sin override: expected_issuer
      # se deriva de KEYCLOAK_URL. NO se setea KEYCLOAK_ISSUER (a diferencia de dev,
      # donde el split localhost:19180 ↔ keycloak:8080 obliga al override).
      KEYCLOAK_URL: https://${KEYCLOAK_HOSTNAME}
      KEYCLOAK_REALM: orpycamcp
      SIGNATURE_SECRET: ${SIGNATURE_SECRET:?Signature secret required}
      # Faltaba: este servicio consume orpycamcp.document.events. Sin REDIS_URL,
      # `from_url` no falla al construir (es perezoso) y el bucle del consumer se
      # traga la excepción, así que /health sigue en verde para siempre mientras
      # `firma_solicitud.nivel_seguridad` queda desfasado respecto a las
      # reclasificaciones — y el gate de 2FA para nivel>=2 nunca se dispara.
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # ── Sello institucional XAdES (E06) ─────────────────────────────────────
      # SIGNER_ALLOW_DEV_SEAL y TSA_ALLOW_DEV_SEAL NO se ponen a propósito: en
      # producción un tenant sin sello propio debe fallar cerrado (503), no
      # firmar con el par compartido de desarrollo.
      SIGNER_PROVIDER: ${SIGNER_PROVIDER:-xades_local}
      SIGNER_CERT_DIR: /run/secrets/signing
      SIGNER_TIMESTAMP_ENABLED: ${SIGNER_TIMESTAMP_ENABLED:-true}
      TSA_URL: ${TSA_URL:-}
      TSA_CERT_DIR: /run/secrets/tsa
      SIGNER_LT_ENABLED: ${SIGNER_LT_ENABLED:-false}
      SIGNER_LT_REQUIRE: ${SIGNER_LT_REQUIRE:-false}
      SIGNER_OCSP_ENABLED: ${SIGNER_OCSP_ENABLED:-true}
      SIGNER_OCSP_REQUIRE: ${SIGNER_OCSP_REQUIRE:-false}
      # ── D-02: los cuatro pares emisor/receptor de este servicio ─────────────
      STORAGE_INTERNAL_TOKEN: ${STORAGE_INTERNAL_TOKEN:?Storage internal token required}
      SIGNATURE_INTERNAL_TOKEN: ${SIGNATURE_INTERNAL_TOKEN:?Signature internal token required}
      SIGNING_KEY_INTERNAL_TOKEN: ${SIGNING_KEY_INTERNAL_TOKEN:?Signing key internal token required}
      NOTIFICATION_INTERNAL_TOKEN: ${NOTIFICATION_INTERNAL_TOKEN:?Notification internal token required}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # Solo lectura y solo material que este servicio necesita. La clave privada
      # de la CA (secrets/ca-authority*) NUNCA se monta aquí.
      - ../secrets/signing:/run/secrets/signing:ro
      - ../secrets/tsa:/run/secrets/tsa:ro
    networks:
      - orpycamcp-net
    expose:
      - "8008"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8008/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  knowledge-service:
    # Capa de conocimiento (E21, pgvector). INTERNAL_SERVICE_TOKEN obligatorio:
    # sin él la ingesta queda fail-closed (D-02 / RF-SEG-08) y rechaza todo /ingest.
    build:
      # Contexto en la RAÍZ: el Dockerfile instala shared/orpycamcp_common (ADR-010),
      # que NO existe dentro de services/knowledge-service/.
      context: ..
      dockerfile: services/knowledge-service/Dockerfile
    container_name: orpycamcp-knowledge-service-prod
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      INTERNAL_SERVICE_TOKEN: ${KNOWLEDGE_INTERNAL_TOKEN:?Knowledge internal token required}
      # Faltaba, igual que en signature: la ingesta event-driven (E21) consume
      # orpycamcp.document.events. Sin esto el índice semántico nunca se puebla y
      # el fallo es silencioso.
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - orpycamcp-net
    expose:
      - "8011"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8011/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          # 4G, no 1G como el resto: este servicio construye con WITH_ML=1 (default
          # del Dockerfile) y carga el modelo de embeddings soberano en memoria —
          # torch CPU solo ya pesa ~1,5 GB. Con 1G el contenedor muere por OOM al
          # primer embedding, no al arrancar, que es el modo de fallo más confuso.
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mcp-server:
    # Capa MCP (E18): fachada cliente del api-gateway. Sin BD/Redis/MinIO.
    build:
      context: ../services/mcp-server
      dockerfile: Dockerfile
    container_name: orpycamcp-mcp-server-prod
    restart: unless-stopped
    environment:
      GATEWAY_URL: http://api-gateway:8080
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - orpycamcp-net
    expose:
      - "8009"
    depends_on:
      - api-gateway
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    # SvelteKit SSR (adapter-node) detrás del reverse proxy/TLS. Split de URLs:
    #   - PUBLIC_* → orígenes públicos HTTPS que ve el NAVEGADOR (login PKCE, logout)
    #   - INTERNAL_* → cómo alcanza el SSR al gateway dentro de la red Docker
    # ORIGIN + PROTOCOL_HEADER/HOST_HEADER son IMPRESCINDIBLES tras un proxy: sin
    # ellos adapter-node deriva mal `url.origin` y arma un redirect_uri inválido.
    build:
      context: ../frontend
      dockerfile: Dockerfile
    # Sin container_name fijo: escala (deploy.replicas) → nombres únicos por réplica.
    restart: unless-stopped
    environment:
      PORT: "3000"
      # adapter-node limita el cuerpo a 512 KB por defecto y las subidas de anexos
      # pasan por el SSR: sin esto, todo PDF escaneado real muere en 413. Coincide
      # con el tope del gateway (MAX_REQUEST_BODY_BYTES) — subirlo aquí sin el
      # flujo por trozos del gateway cambiaría el 413 por un OOM.
      BODY_SIZE_LIMIT: "536870912"
      # Sin esto el SSR ve la IP del proxy, no la del navegador, y todo el tráfico
      # comparte un único cubo de limitación de tasa (ver Dockerfile del frontend).
      ADDRESS_HEADER: x-forwarded-for
      XFF_DEPTH: "1"
      ORIGIN: https://${FRONTEND_HOSTNAME:?Frontend hostname required}
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      # Públicas (navegador): gateway y Keycloak por su dominio público HTTPS.
      PUBLIC_API_URL: https://${API_PUBLIC_HOSTNAME:?Public API hostname required}
      PUBLIC_KEYCLOAK_URL: https://${KEYCLOAK_HOSTNAME}
      # Internas (SSR): el gateway por la red Docker; Keycloak por su hostname
      # público (hostname-strict=true + TLS solo aceptan el dominio del cert).
      INTERNAL_API_URL: http://api-gateway:8080
      INTERNAL_KEYCLOAK_URL: https://${KEYCLOAK_HOSTNAME}
    networks:
      - orpycamcp-net
    # Tras reverse proxy: no publicar el puerto, solo exponerlo a la red interna.
    expose:
      - "3000"
    depends_on:
      - api-gateway
      - keycloak
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
