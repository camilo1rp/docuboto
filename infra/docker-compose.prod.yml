name: orpyca-mcp

# OrpycaMCP — Docker Compose (Production)
#
# SECURITY CHECKLIST before deploy:
# ✓ All credentials from environment variables (.env file)
# ✓ PostgreSQL backup strategy configured
# ✓ MinIO access logs enabled
# ✓ Keycloak TLS certificate installed
# ✓ Redis persistence enabled (RDB or AOF)
# ✓ All services have resource limits
# ✓ External logging configured (ELK, Datadog, etc.)
# ✓ Network isolation (internal services on private network)

networks:
  orpycamcp-net:
    driver: bridge
    # In production, consider using custom driver with encryption
    ipam:
      config:
        - subnet: 172.20.0.0/16

  # Optional: separated network for database if using RDS/managed DB
  # postgres-net:
  #   driver: bridge

volumes:
  postgres-data:
    # In production, use named volumes on persistent storage
    # E.g., AWS EBS, Google Persistent Disk, etc.
  # `minio-data` se conserva DECLARADO aunque ya no lo monte nadie: en un
  # despliegue real guarda el fondo del motor anterior, y bajo Object-Lock en
  # COMPLIANCE sus objetos NO se pueden borrar ni reescribir. Retirarlo es una
  # decisión de la entidad, después de migrar y con acta.
  minio-data:
  objectstore-data:
  redis-data:
  # Keycloak uses external PostgreSQL, no separate volume

services:

  # ─── Infrastructure ───────────────────────────────────────────────────────────

  postgres:
    # pgvector, no postgres a secas: knowledge-service (E21) crea la extensión
    # `vector` en el init. Con la imagen base la extensión no existe y la
    # migración falla a mitad de la provisión del primer tenant.
    image: pgvector/pgvector:pg15
    container_name: orpycamcp-postgres-prod
    restart: unless-stopped
    # ── Presupuesto de conexiones ──────────────────────────────────────────
    #
    # Postgres trae `max_connections=100` por defecto, y ese número **no
    # alcanzaba**. La cuenta de este despliegue, con `db_pool_max_size=10` por
    # servicio (`app/core/config.py`):
    #
    #   auth 10 · tenant 10 · document 10×2 réplicas · storage 10×2 réplicas
    #   workflow 10 · archive 10 · notification 10 · signature 10 · knowledge 10
    #   ────────────────────────────────────────────────────────────────────
    #   = 110 conexiones solo de las aplicaciones
    #
    # (api-gateway y mcp-server no abren pool: no tocan la base de datos.)
    #
    # Y encima Postgres hospeda **también a Keycloak**, cuyo pool por defecto es
    # de 100 más. Sumado, el sistema pedía sobre 210 conexiones a un servidor que
    # concede 100, menos 3 reservadas al superusuario.
    #
    # Lo peor es CÓMO se manifiesta: el pool que llega tarde no falla con un
    # mensaje sobre conexiones — se queda esperando. Y como Keycloak compite por
    # el mismo cupo, el síntoma que ve la institución son **fallos de inicio de
    # sesión** intermitentes, sin relación aparente con la carga documental que
    # los provocó. Nadie mira el número de conexiones buscando eso.
    #
    # Se sube a 300 (110 aplicaciones + 30 Keycloak + margen para migraciones,
    # respaldos, `psql` de operación y una segunda réplica de cualquier
    # servicio). Si se añaden réplicas, esta cuenta se rehace: está escrita aquí
    # para que se pueda rehacer.
    #
    # `shared_buffers` acompaña porque cada conexión reserva memoria de trabajo;
    # triplicar el cupo sin tocarlo cambia un límite por otro.
    command: >
      postgres
      -c max_connections=300
      -c shared_buffers=512MB
    environment:
      POSTGRES_USER: ${DB_USER:?Database user required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password required}
      POSTGRES_DB: ${DB_NAME:?Database name required}
    # SECURITY: Don't expose database port externally
    # Only internal services access this
    networks:
      - orpycamcp-net
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # OJO con la ruta: este compose vive en infra/, el script en la raíz. Con
      # `./scripts/...` Docker no falla — crea un DIRECTORIO vacío y lo monta, así
      # que el init no corre y no existen ni el schema `keycloak` ni la extensión
      # `vector` ni public._migrations. El fallo aparece después, en Keycloak.
      - ../scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      # Optional: database backup script
      # - ./infra/postgres/backup.sh:/usr/local/bin/backup.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: orpycamcp-redis-prod
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Redis password required}
    networks:
      - orpycamcp-net
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    # RustFS, no MinIO. Tag FIJO y con digest, no `latest`: aquí vive el
    # Object-Lock en modo COMPLIANCE, donde una retención mal aplicada es
    # IRREVERSIBLE durante décadas. Que la imagen cambie sola en el siguiente
    # `pull` —con el comportamiento de retención que traiga esa versión— no es un
    # riesgo aceptable para el almacén de preservación. Actualizarla es un acto
    # deliberado, con su ensayo y con la batería de conformidad WORM de nuevo en
    # verde ANTES de desplegar.
    # Digest de esta versión (verificable con `docker image inspect`):
    #   sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    #
    # Por qué se cambió de motor: MinIO **archivó su proyecto de código abierto**
    # y retiró sus imágenes de todos los registros públicos —quay.io responde
    # `denied`, Docker Hub 404, el binario de dl.min.io 410 y el digest anotado
    # tampoco resuelve—. La lección, anotada aquí porque es donde más importa: un
    # registro público es un canal de distribución, **no un archivo**. Para un
    # almacén de preservación que debe durar décadas, la entidad debería guardar
    # su propia copia de la imagen (`docker save`) junto al resto de sus
    # instrumentos de recuperación.
    #
    # Por qué RustFS: lo decidió una batería de conformidad WORM contra el
    # almacén REAL (`services/storage-service/tests/integration/
    # test_worm_object_lock_real_s3.py`). Medido: RustFS 1.0.0 **7/7**, MinIO
    # **7/7** (línea base), Garage **0/7** (control negativo). Las siete pruebas
    # incluyen borrar la versión retenida con credencial RAÍZ, que es lo que
    # distingue COMPLIANCE de GOVERNANCE y lo que el Ac. AGN 001/2024
    # art. 4.3.2.4 P1 exige para el verbo «eliminados».
    #
    # Las variables `MINIO_*` de los demás servicios NO cambian: son el contrato
    # interno del cliente S3. Léanse como «el almacén de objetos».
    image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    container_name: orpycamcp-minio-prod
    restart: unless-stopped
    environment:
      # Mismos nombres de variable que antes —el operador no tiene que rehacer su
      # `.env`— y misma exigencia: sin secreto, el servicio no arranca.
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:?usuario raíz del almacén de objetos requerido}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?clave raíz del almacén de objetos requerida}
      RUSTFS_VOLUMES: /data
    networks:
      - orpycamcp-net
    volumes:
      # Volumen nuevo: la compatibilidad on-disk de RustFS con MinIO la marcan sus
      # propios autores como preview, así que NO se reinterpreta el fondo
      # existente. En un despliegue con datos reales esto exige una migración
      # explícita (`mc mirror` u homólogo) y re-sellar la retención, que es una
      # decisión de la entidad y no un efecto colateral de un `up -d`.
      - objectstore-data:/data
    # SECURITY: Only expose the S3 API to the internal network.
    # Use a reverse proxy (Nginx) for external access.
    expose:
      - "9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: orpycamcp-keycloak-prod
    restart: unless-stopped
    command: start --db=postgres --hostname-strict=true --hostname=${KEYCLOAK_HOSTNAME:?Keycloak hostname required}
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      KC_DB_USERNAME: ${DB_USER}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KC_DB_SCHEMA: keycloak
      # Keycloak abre por defecto hasta 100 conexiones contra el MISMO Postgres
      # que usan los nueve servicios. Acotarlo es la otra mitad del presupuesto
      # de conexiones documentado en el bloque `postgres` de este fichero: sin
      # este tope, un pico de carga documental y el inicio de sesión compiten por
      # el mismo cupo y lo que falla es el login.
      KC_DB_POOL_MAX_SIZE: "30"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:?Keycloak admin user required}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Keycloak admin password required}

      # TLS TERMINADO EN EL REVERSE PROXY (es el despliegue que documenta la guía
      # y el que asume el resto de este fichero: todos los servicios usan `expose:`,
      # ninguno publica puerto). Keycloak habla HTTP plano DENTRO de la red Docker
      # y confía en las cabeceras X-Forwarded-* del proxy.
      #
      # La configuración anterior (HTTPS_ENABLED=true + HTTP_ENABLED=false) con el
      # bloque de certificados comentado abajo hacía que el contenedor muriera al
      # arrancar con «Key material not provided» — y sin identidad no hay sistema.
      # Si terminas TLS AQUÍ en vez de en el proxy: invierte estas dos variables,
      # descomenta el montaje de certificados y añade KC_HTTPS_PORT: "8443".
      KC_HTTP_ENABLED: "true"
      KC_HTTPS_ENABLED: "false"
      KC_PROXY_HEADERS: xforwarded

      # Performance tuning
      # KC_CACHE_STACK solo aplica a clúster; `kubernetes` sobre Compose plano hace
      # que el descubrimiento JGroups falle. Con una sola instancia, `default` basta.
      KC_CACHE: local
    networks:
      - orpycamcp-net
    # Montajes opcionales (descomenta y añade `volumes:` como lista cuando los uses):
    # volumes:
    #   # Certificado TLS (si NO terminas TLS en el reverse proxy):
    #   - ./certs/tls.crt:/etc/x509/https/tls.crt:ro
    #   - ./certs/tls.key:/etc/x509/https/tls.key:ro
    #   # Realm de PRODUCCIÓN propio. NO reutilizar `realm-dev.json`: trae dos
    #   # usuarios con contraseña publicada en el repositorio, secretos de cliente
    #   # `change-me-in-production`, `sslRequired: none` y redirectUris a localhost.
    #   # Parte de `infra/keycloak/realm-prod.json.example`, cópialo a
    #   # `realm-prod.json` y sustituye todo lo que aparece entre <>:
    #   - ./keycloak/realm-prod.json:/opt/keycloak/data/import/realm-prod.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3G
        reservations:
          cpus: '1'
          memory: 1.5G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Application Services ──────────────────────────────────────────────────────

  api-gateway:
    build:
      # Contexto en la RAÍZ: el gateway instala `shared/` como los demás.
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    # Sin container_name fijo: este servicio escala (deploy.replicas), los nombres
    # deben ser únicos por réplica (Compose los genera como proyecto-servicio-N).
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_APP_USER:?DB_APP_USER es obligatorio}:${DB_APP_PASSWORD:?DB_APP_PASSWORD es obligatorio}@postgres:5432/${DB_NAME}
      MIGRATIONS_DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      EVENT_SIGNING_SECRET: ${EVENT_SIGNING_SECRET:?EVENT_SIGNING_SECRET es obligatorio}
      IDENTITY_SIGNING_SECRET: ${IDENTITY_SIGNING_SECRET:?IDENTITY_SIGNING_SECRET es obligatorio}
      AUTH_CACHE_MAC_SECRET: ${AUTH_CACHE_MAC_SECRET:?AUTH_CACHE_MAC_SECRET es obligatorio}
      KEYCLOAK_URL: https://${KEYCLOAK_HOSTNAME}
      KEYCLOAK_REALM: orpycamcp
      KEYCLOAK_CLIENT_ID: api-gateway
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_API_GATEWAY_SECRET:?API Gateway Keycloak secret required}
      TENANT_HEADER: X-Tenant-Slug
      # Intermediarios de CONFIANZA: solo se cree el `X-Forwarded-For` que
      # escriben ellos (ver services/api-gateway/app/core/client_ip.py). Sin
      # declararlos, la cabecera se ignora entera y todo el tráfico comparte la
      # IP del contenedor del SSR — que es el estado fail-closed, correcto pero
      # inservible para limitar por IP. Por defecto: la subred de esta red Docker,
      # donde viven el frontend SSR y el reverse proxy si corre en el mismo host.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.20.0.0/16}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - orpycamcp-net
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # `curl` NO existe en `python:3.11-slim`, que es la base de esta imagen: el
      # healthcheck fallaba SIEMPRE con «executable file not found». Docker lo
      # cuenta como fallo del contenedor, así que el gateway quedaba `unhealthy`
      # de forma permanente y todo `depends_on: service_healthy` que apunte a él
      # se bloquea. Se usa el mismo intérprete que ya corre dentro, igual que en
      # los demás servicios de este fichero.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 2  # Scale horizontally
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  auth-service:
    build:
      # Contexto en la RAÍZ: el Dockerfile instala shared/orpycamcp_common (ADR-010),
      # que NO existe dentro de services/auth-service/.
      context: ..
      dockerfile: services/auth-service/Dockerfile
    container_name: orpycamcp-auth-service-prod
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_APP_USER:?DB_APP_USER es obligatorio}:${DB_APP_PASSWORD:?DB_APP_PASSWORD es obligatorio}@postgres:5432/${DB_NAME}
      MIGRATIONS_DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      EVENT_SIGNING_SECRET: ${EVENT_SIGNING_SECRET:?EVENT_SIGNING_SECRET es obligatorio}
      IDENTITY_SIGNING_SECRET: ${IDENTITY_SIGNING_SECRET:?IDENTITY_SIGNING_SECRET es obligatorio}
      KEYCLOAK_URL: https://${KEYCLOAK_HOSTNAME}
      KEYCLOAK_REALM: orpycamcp
      KEYCLOAK_CLIENT_ID: auth-service
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_AUTH_SERVICE_SECRET:?Auth Service secret required}
      # ── Claves de cifrado en reposo (KEK) ────────────────────────────────────
      # Ambas son base64 de 32 bytes y son SECRETOS DISTINTOS con propósitos
      # distintos: TOTP_ENCRYPTION_KEY cifra el secreto TOTP del segundo factor,
      # SIGNING_KEY_ENCRYPTION_KEY envuelve la clave privada de firma personal.
      # Sin ellas los endpoints correspondientes fallan CERRADOS (500), que es lo
      # correcto — pero en producción eso significa «nadie enrola 2FA ni firma»,
      # así que se exigen con `:?` en vez de dejarlas vacías por defecto.
      # Generar: openssl rand -base64 32
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?TOTP encryption key required (openssl rand -base64 32)}
      SIGNING_KEY_ENCRYPTION_KEY: ${SIGNING_KEY_ENCRYPTION_KEY:?Signing key encryption key required (openssl rand -base64 32)}
      # Token servicio-a-servicio que protege POST /internal/signing-key/* — el
      # llamante es signature-service, que debe traer EXACTAMENTE este valor.
      SIGNING_KEY_INTERNAL_TOKEN: ${SIGNING_KEY_INTERNAL_TOKEN:?Signing key internal token required}
      # Certificado PÚBLICO de la sub-CA que emite las credenciales de usuario.
      # La clave privada (ca-users.key) NUNCA se monta aquí.
      SIGNING_KEY_CA_USERS_CERT_PATH: /run/secrets/ca-users-public/ca-users.crt
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # Solo material público, solo lectura.
      - ../secrets/ca-users-public:/run/secrets/ca-users-public:ro
    networks:
      - orpycamcp-net
    expose:
      - "8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  tenant-service:
    build:
      # Contexto en la RAÍZ: el Dockerfile instala shared/orpycamcp_common (ADR-010),
      # que NO existe dentro de services/tenant-service/.
      context: ..
      dockerfile: services/tenant-service/Dockerfile
    container_name: orpycamcp-tenant-service-prod
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      EVENT_SIGNING_SECRET: ${EVENT_SIGNING_SECRET:?EVENT_SIGNING_SECRET es obligatorio}
      IDENTITY_SIGNING_SECRET: ${IDENTITY_SIGNING_SECRET:?IDENTITY_SIGNING_SECRET es obligatorio}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - orpycamcp-net
    expose:
      - "8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  document-service:
    build:
      # Contexto en la RAÍZ: el Dockerfile instala shared/orpycamcp_common (ADR-010),
      # que NO existe dentro de services/document-service/.
      context: ..
      dockerfile: services/document-service/Dockerfile
    # Sin container_name fijo: escala (deploy.replicas) → nombres únicos por réplica.
    restart: unless-stopped
    environment:
      # Custodia de las credenciales de los buzones institucionales. Sin ella el
      # servicio arranca pero no puede descifrar lo que guardó, y la ingesta de
      # correo queda muerta sin decirlo. Faltaba en este manifiesto por completo.
      EMAIL_ENCRYPTION_KEY: ${EMAIL_ENCRYPTION_KEY:?EMAIL_ENCRYPTION_KEY es obligatorio}
      # El AÑO del número de radicado se decide aquí, no en UTC: Colombia es
      # UTC-5 y lo radicado el 31 de diciembre por la tarde recibía el número
      # del año siguiente, contradiciendo la fecha de su propio acuse.
      TZ_RADICACION: ${TZ_RADICACION:-America/Bogota}
      DATABASE_URL: postgresql+asyncpg://${DB_APP_USER:?DB_APP_USER es obligatorio}:${DB_APP_PASSWORD:?DB_APP_PASSWORD es obligatorio}@postgres:5432/${DB_NAME}
      MIGRATIONS_DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      EVENT_SIGNING_SECRET: ${EVENT_SIGNING_SECRET:?EVENT_SIGNING_SECRET es obligatorio}
      IDENTITY_SIGNING_SECRET: ${IDENTITY_SIGNING_SECRET:?IDENTITY_SIGNING_SECRET es obligatorio}
      # D-02: secreto compartido con storage-service.INTERNAL_SERVICE_TOKEN.
      # document-service MEDIA la descarga de anexos (gate por clearance vigente)
      # y necesita este token para hablar con storage. Sin él, storage responde
      # 401 a TODA descarga — fail-closed correcto, sistema inservible.
      STORAGE_INTERNAL_TOKEN: ${STORAGE_INTERNAL_TOKEN:?Storage internal token required}
      # Token que protege los endpoints /internal de ESTE servicio (los consume
      # archive-service al ensamblar el AIP y el export del expediente).
      INTERNAL_SERVICE_TOKEN: ${DOCUMENT_INTERNAL_TOKEN:?Document internal token required}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - orpycamcp-net
    expose:
      - "8003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 2  # Scale horizontally for read load
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  storage-service:
    build:
      # Contexto en la RAÍZ (ADR-010, mismo motivo que signature-service más
      # abajo): el Dockerfile instala shared/orpycamcp_common, que NO existe
      # dentro de services/storage-service/ -- `context: ../services/storage-service`
      # (como estaba antes) rompería ese COPY. target=production (E10
      # Increment C2b) añade Java + veraPDF CLI real y corre como usuario
      # NO-root -- ver comentarios en services/storage-service/Dockerfile
      # para el detalle completo (la imagen de dev, target por defecto, se
      # mantiene slim, sin Java).
      context: ..
      dockerfile: services/storage-service/Dockerfile
      target: production
    # Sin container_name fijo: escala (deploy.replicas) → nombres únicos por réplica.
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_APP_USER:?DB_APP_USER es obligatorio}:${DB_APP_PASSWORD:?DB_APP_PASSWORD es obligatorio}@postgres:5432/${DB_NAME}
      MIGRATIONS_DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      EVENT_SIGNING_SECRET: ${EVENT_SIGNING_SECRET:?EVENT_SIGNING_SECRET es obligatorio}
      IDENTITY_SIGNING_SECRET: ${IDENTITY_SIGNING_SECRET:?IDENTITY_SIGNING_SECRET es obligatorio}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      # El campo real es `minio_use_ssl` (core/config.py:24). `MINIO_SECURE` no
      # existe y `extra="ignore"` lo descartaba en silencio: la variable prometía
      # TLS sobre tráfico que iba en claro. Se deja en false porque el MinIO de
      # este compose no tiene certificados y el tráfico no sale de la red Docker;
      # ponerlo en true exige montarlos y configurar MinIO en modo TLS.
      MINIO_USE_SSL: "false"
      # Token que protege los endpoints internos de storage. Es el MISMO valor
      # que STORAGE_INTERNAL_TOKEN en document/archive/signature-service.
      INTERNAL_SERVICE_TOKEN: ${STORAGE_INTERNAL_TOKEN:?Storage internal token required}
      # WORM/Object-Lock (E10). Sin APP_ENV=production el resolutor exige modo
      # COMPLIANCE explícito; sin PRESERVATION_ENABLED el índice electrónico y el
      # acta de transferencia se cierran SIN protección y el trabajo de reintento
      # acumula backlog en silencio.
      APP_ENV: production
      PRESERVATION_ENABLED: "true"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # VERAPDF_BINARY/PDFA_VALIDATOR/PRESERVATION_PDFA_VALIDATION_ENABLED ya
      # vienen como ENV del stage "production" del Dockerfile (valores por
      # defecto correctos para este despliegue) -- se sobrescriben acá SOLO
      # si una instalación concreta necesita desviarse (p. ej. un perfil PDF/A
      # institucional distinto de "2b", ver PDFA_PROFILE en core/config.py).
      PDFA_PROFILE: ${PDFA_PROFILE:-2b}
    networks:
      - orpycamcp-net
    expose:
      - "8005"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 2  # Scale for file upload throughput
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

