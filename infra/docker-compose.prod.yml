  signature-service:
    # Firma electrónica (E06). Contexto raíz: el Dockerfile instala shared/orpycamcp_common (ADR-010).
    build:
      context: ..
      dockerfile: services/signature-service/Dockerfile
    container_name: orpycamcp-signature-service-prod
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_APP_USER:?DB_APP_USER es obligatorio}:${DB_APP_PASSWORD:?DB_APP_PASSWORD es obligatorio}@postgres:5432/${DB_NAME}
      MIGRATIONS_DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      # En prod el navegador y los servicios usan el MISMO hostname público de
      # Keycloak (DNS real), así que el `iss` coincide sin override: expected_issuer
      # se deriva de KEYCLOAK_URL. NO se setea KEYCLOAK_ISSUER (a diferencia de dev,
      # donde el split localhost:19180 ↔ keycloak:8080 obliga al override).
      KEYCLOAK_URL: https://${KEYCLOAK_HOSTNAME}
      KEYCLOAK_REALM: orpycamcp
      SIGNATURE_SECRET: ${SIGNATURE_SECRET:?Signature secret required}
      # Faltaba: este servicio consume orpycamcp.document.events. Sin REDIS_URL,
      # `from_url` no falla al construir (es perezoso) y el bucle del consumer se
      # traga la excepción, así que /health sigue en verde para siempre mientras
      # `firma_solicitud.nivel_seguridad` queda desfasado respecto a las
      # reclasificaciones — y el gate de 2FA para nivel>=2 nunca se dispara.
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      EVENT_SIGNING_SECRET: ${EVENT_SIGNING_SECRET:?EVENT_SIGNING_SECRET es obligatorio}
      IDENTITY_SIGNING_SECRET: ${IDENTITY_SIGNING_SECRET:?IDENTITY_SIGNING_SECRET es obligatorio}
      # ── Sello institucional XAdES (E06) ─────────────────────────────────────
      # SIGNER_ALLOW_DEV_SEAL y TSA_ALLOW_DEV_SEAL NO se ponen a propósito: en
      # producción un tenant sin sello propio debe fallar cerrado (503), no
      # firmar con el par compartido de desarrollo.
      SIGNER_PROVIDER: ${SIGNER_PROVIDER:-xades_local}
      SIGNER_CERT_DIR: /run/secrets/signing
      SIGNER_TIMESTAMP_ENABLED: ${SIGNER_TIMESTAMP_ENABLED:-true}
      TSA_URL: ${TSA_URL:-}
      TSA_CERT_DIR: /run/secrets/tsa
      SIGNER_LT_ENABLED: ${SIGNER_LT_ENABLED:-false}
      SIGNER_LT_REQUIRE: ${SIGNER_LT_REQUIRE:-false}
      SIGNER_OCSP_ENABLED: ${SIGNER_OCSP_ENABLED:-true}
      SIGNER_OCSP_REQUIRE: ${SIGNER_OCSP_REQUIRE:-false}
      # ── D-02: los cuatro pares emisor/receptor de este servicio ─────────────
      STORAGE_INTERNAL_TOKEN: ${STORAGE_INTERNAL_TOKEN:?Storage internal token required}
      SIGNATURE_INTERNAL_TOKEN: ${SIGNATURE_INTERNAL_TOKEN:?Signature internal token required}
      SIGNING_KEY_INTERNAL_TOKEN: ${SIGNING_KEY_INTERNAL_TOKEN:?Signing key internal token required}
      NOTIFICATION_INTERNAL_TOKEN: ${NOTIFICATION_INTERNAL_TOKEN:?Notification internal token required}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # Solo lectura y solo material que este servicio necesita. La clave privada
      # de la CA (secrets/ca-authority*) NUNCA se monta aquí.
      - ../secrets/signing:/run/secrets/signing:ro
      - ../secrets/tsa:/run/secrets/tsa:ro
    networks:
      - orpycamcp-net
    expose:
      - "8008"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8008/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  knowledge-service:
    # Capa de conocimiento (E21, pgvector). INTERNAL_SERVICE_TOKEN obligatorio:
    # sin él la ingesta queda fail-closed (D-02 / RF-SEG-08) y rechaza todo /ingest.
    build:
      # Contexto en la RAÍZ: el Dockerfile instala shared/orpycamcp_common (ADR-010),
