# OrpycaMCP — tema de las pantallas de identidad (Keycloak).
#
# La pantalla de acceso es la ÚNICA del recorrido que no pasa por SvelteKit, así
# que se quedó fuera de todo el trabajo de diseño: salía con el tema por defecto
# —fondo poligonal gris, botón azul PatternFly, «Sign in to your account» en
# inglés— justo ANTES de la pantalla de Orpyca, que sí está cuidada. Van
# seguidas, así que el contraste era máximo.
#
# `parent=keycloak` hereda plantillas y comportamiento: aquí solo se cambia la
# piel. No se copian los `.ftl`, a propósito — una plantilla copiada se queda
# congelada en la versión en que se copió y hay que re-auditarla en cada
# actualización de Keycloak, que es donde viven los arreglos de seguridad de
# las pantallas de identidad.
parent=keycloak
import=common/keycloak

styles=css/login.css css/orpyca.css

# El idioma NO se fija aquí: se declara en el realm (`internationalizationEnabled`
# + `defaultLocale: es`), porque Keycloak 24 ya trae las traducciones al español
# y escribirlas a mano sería mantener una copia peor de algo que ya existe.
