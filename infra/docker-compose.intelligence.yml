# Fragmento intelligence (ADR-045 §8).
#
# No define servicios. No lo incluye el manifiesto base: se suma con
# `-f docker-compose.intelligence.yml`. La red se crea una vez por host,
# fuera de este proyecto y del del proveedor:
#   docker network create --internal ppi
# PPI_PROVIDER_URL no tiene valor por defecto.

services:
  app:
    environment:
      PPI_PROVIDER_URL: ${PPI_PROVIDER_URL:?URL del proveedor en la red ppi}
      INTELLIGENCE_CREDENTIAL_KEK: ${INTELLIGENCE_CREDENTIAL_KEK:?KEK del cliente de servicio}
      PPI_CAPABILITIES_PUBLIC_KEY: ${PPI_CAPABILITIES_PUBLIC_KEY:?clave pública de la declaración}
      PPI_CAPABILITIES_KID: ${PPI_CAPABILITIES_KID:?kid de la declaración}
      PPI_CALLBACK_BASE_URL: ${PPI_CALLBACK_BASE_URL:?origen de las URL de retorno}
    networks:
      - ppi
  knowledge-service:
    environment:
      PPI_PROVIDER_URL: ${PPI_PROVIDER_URL:?URL del proveedor en la red ppi}
      INTELLIGENCE_CREDENTIAL_KEK: ${INTELLIGENCE_CREDENTIAL_KEK:?KEK del cliente de servicio}
      PPI_CAPABILITIES_PUBLIC_KEY: ${PPI_CAPABILITIES_PUBLIC_KEY:?clave pública de la declaración}
      PPI_CAPABILITIES_KID: ${PPI_CAPABILITIES_KID:?kid de la declaración}
      PPI_CALLBACK_BASE_URL: ${PPI_CALLBACK_BASE_URL:?origen de las URL de retorno}
      KEYCLOAK_URL: https://${KEYCLOAK_HOSTNAME}
      KEYCLOAK_REALM: orpycamcp
    networks:
      - ppi

networks:
  ppi:
    external: true
    name: ppi
