# OrpycaMCP — Sistema de Gestión Documental Electrónico de Archivo (SGDEA).
# Software libre (AGPL v3 o posterior). Véase el archivo LICENSE.
#
# CI de Docuboto (ADR-053 §3). Sustituye a `.gitlab-ci.yml`: el repositorio vive
# en GitHub y los PR no recibían ninguna comprobación.
#
# Qué corre y cuándo (la misma política de coste que tenía GitLab):
#
#   * SIEMPRE (cada PR y cada push a main): `lint`, `test-unit-shared`,
#     `test-security-smoke` y `npm-audit`. Son baratos y son los que cruzan
#     servicios o cierran puertas (rutas internas que no pueden quedar abiertas).
#   * COMPLETO (PR, tag X.Y.Z vía release.yml, o a mano con «Run workflow»): la
#     matriz unitaria de los once servicios, integración contra PostgreSQL real,
#     frontend, veraPDF por subproceso y la construcción estricta del sitio.
#   * `storage-worm-real` además corre en un push a main que cambie un compose:
#     RustFS es joven, y cambiar su imagen sin la batería WORM es el riesgo.
#
# Los guardianes de `shared/tests/` (test_matriz_ci_cubre_servicios.py,
# test_ci_guardianes_de_infra.py) leen ESTE fichero: la matriz se deriva del
# árbol y un servicio con tests fuera de ella es un fallo, no un olvido.
#
# Lo que no se trajo de GitLab: `claude-review` y `claude-update-docs` (usaban
# push options de GitLab y la documentación se escribe a mano con el código),
# `pages` y `notify-website-docs` (publicaban el sitio de OrpycaMCP, el
# proyecto del que este es un fork).

name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.11"

# «Completo» = `github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')`:
# PR, «Run workflow», o un tag (release.yml llama a este workflow y hereda su
# evento `push` con ref refs/tags/X.Y.Z). Se repite en cada `if:` porque el
# contexto `env` no existe a nivel de trabajo.

jobs:
  # ─── Siempre ──────────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/*/requirements.lock
      # El MISMO gate que corre un desarrollador (`LINT_IN_PROCESS=1` solo evita
      # Docker): reimplementarlo aquí es cómo CI aprueba lo que el gate rechaza.
      - run: |
          pip install --quiet 'ruff>=0.4.0' 'mypy==1.11.0' ./shared
          for lock in services/*/requirements.lock; do pip install --quiet -r "$lock"; done
      - run: LINT_IN_PROCESS=1 ./scripts/lint.sh

  test-unit-shared:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0: el guardián de expandir/contraer (ADR-053 §4) lee el último
      # tag X.Y.Z. git y gnupg vienen en el runner; sin ellos las pruebas fallan.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: shared/pyproject.toml
      - run: pip install --quiet ./shared pytest pytest-asyncio pyyaml packaging cryptography fastapi httpx
      - run: pytest tests/ -q --tb=short
        working-directory: shared

  test-security-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            tests: "tests/test_gateway.py -k 'internal or canal'"
          - service: storage-service
            tests: "tests/test_internal_token_gate.py tests/test_aip_internal_gate.py tests/test_eventos_internal_gate.py tests/test_purge_worm_gate.py"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install --quiet ./shared -r "services/${{ matrix.service }}/requirements.lock"
      - run: eval "pytest -q --tb=short ${{ matrix.tests }}"
        working-directory: services/${{ matrix.service }}

  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high

  # ─── Completo ─────────────────────────────────────────────────────────────
  test-unit:
    if: ${{ github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - tenant-service
          - document-service
          - archive-service
          - storage-service
          - workflow-service
          - notification-service
          - signature-service
          - knowledge-service
          - mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Desde el `.lock` y con `shared/`, como el Dockerfile.
      - run: pip install --quiet ./shared -r "services/${{ matrix.service }}/requirements.lock"
      - run: pytest tests/ -q --tb=short
        working-directory: services/${{ matrix.service }}

  test-integration:
    if: ${{ github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - document-service
          - archive-service
          - storage-service
          - signature-service
          - workflow-service
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: orpycamcp
          POSTGRES_PASSWORD: orpycamcp
          POSTGRES_DB: orpycamcp_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orpycamcp -d orpycamcp_db"
          --health-interval 2s --health-timeout 5s --health-retries 30
      # Antirreplay y nonces contra Redis real (SET NX atómico).
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgresql+asyncpg://orpycamcp:orpycamcp@localhost:5432/orpycamcp_db
      REDIS_URL: redis://localhost:6379/0
      RUN_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install --quiet ./shared -r "services/${{ matrix.service }}/requirements.lock"
      # La cadena única primero (ADR-053): el conftest provisiona esquemas de tenant
      # pero da por hechas las migraciones de `public`.
      - run: python services/docuboto/migrations/runner.py
      # Sin `-m integration`: la convención de marcas no es uniforme; el directorio
      # es el criterio y RUN_INTEGRATION=1 el gate. La batería WORM real la corre
      # `storage-worm-real`, que tiene un almacén de objetos en pie.
      - run: |
          EXTRA=""
          if [ "${{ matrix.service }}" = "storage-service" ]; then
            EXTRA="--ignore=tests/integration/test_worm_object_lock_real_s3.py"
          fi
          pytest -q tests/integration --tb=short $EXTRA
        working-directory: services/${{ matrix.service }}

  test-frontend:
    if: ${{ github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build

  # `SubprocessVeraPdfValidator` corre un binario externo sobre PDF de cualquier
  # tenant. Sin veraPDF real en CI, se ejercita el plumbing real contra un falso.
  storage-verapdf-subprocess:
    if: ${{ github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    env:
      VERAPDF_BINARY: ${{ github.workspace }}/services/storage-service/tests/fakes/fake_verapdf.py
      PDFA_VALIDATOR: verapdf
      PRESERVATION_PDFA_VALIDATION_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: chmod +x services/storage-service/tests/fakes/fake_verapdf.py
      - run: pip install --quiet ./shared -r services/storage-service/requirements.lock
      - run: pytest tests/test_subprocess_verapdf_ci_smoke.py -q --tb=short
        working-directory: services/storage-service

  docs-build:
    if: ${{ github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install --quiet mkdocs mkdocs-material mkdocs-static-i18n
      - run: mkdocs build --strict --site-dir public

  # ─── Batería WORM contra S3 real (AREA-13-01, AREA-08-12) ─────────────────
  # Corre en el modo completo y en un push a main que toque un compose (donde
  # vive `image: rustfs/rustfs`). GitHub no filtra por rutas a nivel de trabajo:
  # `compose-changed` lo decide con git.
  compose-changed:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          changed=false
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$BEFORE" ] \
             && ! git diff --quiet "$BEFORE" HEAD -- 'docker-compose*.yml' infra/docker-compose.prod.yml 2>/dev/null; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  storage-worm-real:
    needs: compose-changed
    if: ${{ github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || needs.compose-changed.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    services:
      # La MISMA imagen, con digest, que infra/docker-compose.prod.yml.
      rustfs:
        image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
        env:
          RUSTFS_ACCESS_KEY: orpycamcp
          RUSTFS_SECRET_KEY: orpycamcp_dev
          RUSTFS_VOLUMES: /data
        ports: ["9000:9000"]
    env:
      RUN_INTEGRATION: "1"
      RUN_S3_WORM: "1"
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: orpycamcp
      MINIO_SECRET_KEY: orpycamcp_dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install --quiet ./shared -r services/storage-service/requirements.lock
      # Sin esperar, el primer test fallaría por conexión y parecería que el motor
      # reprueba el WORM.
      - run: |
          for i in $(seq 1 30); do
            python -c "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')" && break
            sleep 2
          done
      - run: pytest -q tests/integration/test_worm_object_lock_real_s3.py --tb=short
        working-directory: services/storage-service
