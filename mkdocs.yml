site_name: OrpycaMCP
site_description: Sistema de Gestión Documental Libre — Free Document Management System
# El sitio de Orpyca publica esta documentación bajo /docs: su pipeline clona
# este repositorio y corre `mkdocs build` en cada despliegue, para no mantener
# dos copias. Si cambia esta ruta, hay que cambiarla también allá.
site_url: https://orpyca.com/docs
repo_url: https://gitlab.com/orpyca/orfeo_mcp
repo_name: GitLab
edit_uri: edit/main/docs/

theme:
  name: material
  language: es
  logo: assets/logo.png
  favicon: assets/favicon.png
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Modo oscuro / Dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Modo claro / Light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
    - content.tabs.link

plugins:
  - search:
      lang:
        - es
        - en
  # Documentación bilingüe: carpetas docs/es (default) y docs/en.
  # Las páginas sin traducción en docs/en/ caen al español (fallback_to_default).
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      languages:
        - locale: es
          name: Español
          default: true
          build: true
        - locale: en
          name: English
          build: true
          # La `nav` de abajo se escribe una sola vez, en español. Sin estas
          # traducciones el menú superior y las migas quedan en español dentro
          # de la documentación en inglés, aunque el contenido sí esté traducido.
          # La clave es el texto EXACTO del `nav`; si allí se renombra una
          # entrada, hay que renombrarla aquí o volverá a salir en español.
          nav_translations:
            Inicio: Home
            El SGD: Records management
            Dominio documental: Documentary domain
            Marco normativo: Regulatory framework
            Ciclo de vida del documento: Document lifecycle
            Primeros Pasos: Getting started
            Arquitectura: Architecture
            Visión general: Overview
            Decisiones (ADRs): Decisions (ADRs)
            ADR-001 Microservicios: ADR-001 Microservices
            ADR-003 asyncpg sin ORM: ADR-003 asyncpg without an ORM
            ADR-006 Proveedor de IA configurable: ADR-006 Configurable AI provider
            ADR-007 Metadatos JSONB: ADR-007 JSONB metadata
            ADR-008 Auditoría inmutable: ADR-008 Immutable audit trail
            ADR-009 Historial de flujos: ADR-009 Workflow history
            ADR-010 Librería compartida: ADR-010 Shared library
            ADR-012 Migraciones por tenant: ADR-012 Per-tenant migrations
            ADR-013 Autorización en BD: ADR-013 Authorisation resolved in the database
            ADR-014 Búsqueda PostgreSQL FTS: ADR-014 PostgreSQL full-text search
            ADR-015 Modelo TRD/CCD: ADR-015 Retention and classification model
            ADR-016 Firma electrónica: ADR-016 Electronic signature
            ADR-017 Archivo físico: ADR-017 Physical archive
            ADR-018 Interoperabilidad webhooks: ADR-018 Interoperability webhooks
            ADR-019 Capa MCP: ADR-019 MCP layer
            ADR-020 Sistema de diseño Orpyca y asistente: ADR-020 Orpyca design system and assistant
            ADR-021 Reclamación y dead-letter de eventos: ADR-021 Event reclaim and dead-letter
            ADR-022 Índice electrónico v2: ADR-022 Electronic index v2
            ADR-023 WORM/Object-Lock de preservación: ADR-023 Preservation WORM/Object-Lock
            ADR-024 ROOT fuera de banda: ADR-024 Out-of-band ROOT
            ADR-025 TRD como instrumento convalidado: ADR-025 TRD as a convalidated instrument
            ADR-026 TVD de fondo acumulado: ADR-026 TVD for accumulated fonds
            ADR-027 Sustitución del almacén de objetos: ADR-027 Object store replacement
            ADR-028 El flujo mueve el estado del radicado: ADR-028 The workflow moves the radicado status
            ADR-029 Ubicación actual del radicado: ADR-029 Current location of the radicado
            ADR-030 Constancia de firma inobtenible: ADR-030 Unobtainable-signature record
            Pantallas del sistema: System screens
            Referencia API: API reference
            Despliegue: Deployment
            Integraciones externas: External integrations
            Contribuir: Contributing
            Seguridad: Security

extra:
  social:
    - icon: fontawesome/brands/gitlab
      link: https://gitlab.com/orpyca/orfeo_mcp
    - icon: fontawesome/solid/globe
      link: https://orpyca.com

# La nav referencia rutas SIN el prefijo de idioma (es/ o en/).
# El plugin i18n las resuelve por idioma según docs_structure: folder.
