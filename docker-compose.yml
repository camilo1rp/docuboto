# OrpycaMCP — Docker Compose (Development)
# Production: see infra/docker-compose.prod.yml

name: orpyca-mcp

networks:
  orpycamcp-net:
    driver: bridge

volumes:
  postgres-data:
  # `minio-data` se conserva DECLARADO aunque ya no lo monte nadie: guarda el
  # fondo de pruebas del motor anterior y borrarlo sería irreversible. Se retira
  # cuando la migración a RustFS esté asentada y alguien lo decida a sabiendas.
  minio-data:
  objectstore-data:
  keycloak-data:
  redis-data:
  # El modelo de Whisper se baja al primer arranque y se queda aquí: empaquetarlo
  # en la imagen la ataría a un modelo concreto y la haría crecer cientos de MB
  # para quien luego elija otro.
  whisper-models:

services:

  # ─── Infrastructure ───────────────────────────────────────────────────────────

  postgres:
    # pgvector/pgvector:pg15 = PostgreSQL 15 + extensión pgvector (capa de conocimiento E21).
    # Mismo major (15) que la imagen anterior (postgres:15-alpine) → compatible con el volumen existente.
    image: pgvector/pgvector:0.8.7-pg15-bookworm@sha256:47af0b65960b14f1c6945aa4ccae37836c632e9a6fe0eea9160936e616e5b2e9
    container_name: orpycamcp-postgres
    environment:
      POSTGRES_USER: orpycamcp
      POSTGRES_PASSWORD: orpycamcp
      POSTGRES_DB: orpycamcp_db
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - orpycamcp-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orpycamcp -d orpycamcp_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    container_name: orpycamcp-redis
    ports:
      # Solo el bucle local, y CON contraseña: en desarrollo Redis guarda los
      # streams de eventos de todas las entidades y la caché de identidad del
      # gateway. Abierto y sin credencial, cualquiera en la misma red podía
      # leerlo o escribirle — que es la puerta de dos hallazgos de esta auditoría.
      - "127.0.0.1:16379:6379"
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:-orpycamcp_redis_dev}
    volumes:
      - redis-data:/data
    networks:
      - orpycamcp-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-orpycamcp_redis_dev}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    # RustFS, no MinIO — y el nombre del servicio se conserva a propósito.
    #
    # Por qué se cambió de motor: MinIO **archivó su proyecto de código abierto**
    # y retiró sus imágenes de TODOS los registros públicos. quay.io —donde este
    # compose ya se había mudado cuando Docker Hub se vació— responde `denied`,
    # su API lista cero tags, y el rescate por el digest que este bloque tenía
    # anotado tampoco funciona. Hasta el binario de `dl.min.io` da 410. Sin la
    # imagen en caché local, la pila entera dejaba de arrancar: un pin protege de
    # que te cambien la versión, no de que te la quiten.
    #
    # Por qué RustFS y no otro: lo decide una batería de conformidad WORM contra
    # el almacén REAL (`services/storage-service/tests/integration/
    # test_worm_object_lock_real_s3.py`), no un folleto. Resultado medido:
    # RustFS 1.0.0 **7/7**, MinIO **7/7** (línea base), Garage **0/7** (control
    # negativo: sin Object Lock, y por diseño no puede tenerlo). Las siete
    # pruebas incluyen borrar la versión retenida **con credencial raíz**, que es
    # lo que distingue COMPLIANCE de GOVERNANCE y lo que el Ac. AGN 001/2024
    # art. 4.3.2.4 P1 exige para el verbo «eliminados».
    #
    # El nombre del servicio, del contenedor y las variables `MINIO_*` de los
    # servicios NO cambian: son el contrato interno del cliente S3
    # (`miniopy_async`, que habla S3 estándar) y aparecen en 13 ficheros de
    # código. Renombrarlos multiplicaría el riesgo de esta migración sin ganar
    # nada. Léase `MINIO_*` como «el almacén de objetos S3», que es lo que
    # significa desde esta migración.
    image: rustfs/rustfs:1.0.0
    container_name: orpycamcp-minio
    environment:
      RUSTFS_ACCESS_KEY: orpycamcp
      RUSTFS_SECRET_KEY: orpycamcp_dev
      RUSTFS_VOLUMES: /data
    ports:
      - "19900:9000"
    volumes:
      # Volumen NUEVO, no el `minio-data` anterior: la compatibilidad on-disk de
      # RustFS con MinIO está marcada como preview por sus propios autores, así
      # que el fondo se resiembra en vez de reinterpretarse. `minio-data` se deja
      # intacto —no se borra— por si hiciera falta volver atrás.
      - objectstore-data:/data
    networks:
      - orpycamcp-net
    healthcheck:
      # `/health` es el propio de RustFS. También responde `/minio/health/live`
      # por compatibilidad, pero usar ese nombre aquí sería describir el
      # despliegue con el motor que ya no está.
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5@sha256:f8ade94c1d0ad2f2fa7734a455fee5392764f402c43ca35e9af6bf63a2541dc9
    container_name: orpycamcp-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/orpycamcp_db
      KC_DB_USERNAME: orpycamcp
      KC_DB_PASSWORD: orpycamcp
      KC_DB_SCHEMA: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: orpycamcp_dev
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      # Fija las frontend-URLs (incluido el `iss` de los tokens) a la URL pública
      # por la que el navegador hace el login PKCE. Aunque el SSR del frontend y
      # los backends alcancen Keycloak internamente por http://keycloak:8080, el
      # issuer emitido es SIEMPRE http://localhost:19180/realms/orpycamcp → así
      # navegador y servidor coinciden y la validación del `iss` no rechaza tokens.
      KC_HOSTNAME_URL: http://localhost:19180
    ports:
      - "19180:8080"
    volumes:
      # `realm-dev.json`, no `realm-export.json`: el nombre anterior no decía para
      # qué entorno servía, y este trae usuarios con contraseña publicada en el
      # repositorio. Producción parte de `realm-prod.json.example` (11.6).
      # Ese JSON NO admite comentarios: Jackson aborta la importación ante
      # cualquier clave desconocida y el contenedor no arranca. La explicación
      # del realm vive en `infra/keycloak/README.md`.
      - ./infra/keycloak/realm-dev.json:/opt/keycloak/data/import/realm-dev.json:ro
      # Tema propio de las pantallas de identidad. La de acceso es la ÚNICA del
      # recorrido que no pasa por SvelteKit, así que sin esto sale con el tema
      # por defecto —fondo gris, botón azul, textos en inglés— justo ANTES de la
      # pantalla de Orpyca. Solo lectura: el contenedor no escribe aquí.
      - ./infra/keycloak/themes:/opt/keycloak/themes:ro
    networks:
      - orpycamcp-net
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Application Services ──────────────────────────────────────────────────────

  api-gateway:
    build:
      # Contexto en la RAÍZ: el gateway instala `shared/` como los demás.
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: orpycamcp-gateway
    ports:
      - "19080:8080"
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-orpycamcp_redis_dev}@redis:6379/0
      - EVENT_SIGNING_SECRET=${EVENT_SIGNING_SECRET:-orpycamcp_event_signing_dev}
      - IDENTITY_SIGNING_SECRET=${IDENTITY_SIGNING_SECRET:-orpycamcp_identity_signing_dev}
      - MCP_ORIGIN_SECRET=${MCP_ORIGIN_SECRET:-orpycamcp_mcp_origin_dev}
      - AUTH_CACHE_MAC_SECRET=${AUTH_CACHE_MAC_SECRET:-orpycamcp_auth_cache_mac_dev}
      # Documentación navegable, SOLO en desarrollo. En producción el catálogo
      # describe la superficie entera —incluidos los endpoints internos que el
      # ruteo retira a propósito— y no se sirve sin credenciales.
      - OPENAPI_PUBLICO=${OPENAPI_PUBLICO:-true}
      - AUTH_SERVICE_URL=http://auth-service:8001
      # Dev: la red por defecto de Compose está en 172.16/12. Sin esto el gateway
      # ignora X-Forwarded-For (fail-closed) y todo el SSR comparte un cubo.
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-172.16.0.0/12}
      - TENANT_SERVICE_URL=http://tenant-service:8002
      - DOCUMENT_SERVICE_URL=http://document-service:8003
      - ARCHIVE_SERVICE_URL=http://archive-service:8004
      - STORAGE_SERVICE_URL=http://storage-service:8005
      - WORKFLOW_SERVICE_URL=http://workflow-service:8006
      - NOTIFICATION_SERVICE_URL=http://notification-service:8007
      - SIGNATURE_SERVICE_URL=http://signature-service:8008
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=orpycamcp
    networks:
      - orpycamcp-net
    depends_on:
      - redis
      - keycloak
    restart: "no"
    mem_limit: 2g
    memswap_limit: 2g

  mcp-server:
    # Capa MCP (E18, ADR-019): fachada fina cliente del api-gateway. Sin BD/MinIO/Redis.
    build:
      context: .
      dockerfile: services/mcp-server/Dockerfile
    container_name: orpycamcp-mcp
    ports:
      - "127.0.0.1:19009:8009"
    environment:
      - GATEWAY_URL=http://api-gateway:8080
      # Asistente conversacional (E18). SIN la clave, el asistente degrada
      # honestamente a 503 assistant_unavailable (el catálogo MCP sigue OK).
      # La clave NUNCA se versiona: se toma del entorno del host (o .env no
      # versionado). Modelo por defecto: claude-opus-4-8 (config.py).
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Clave de firma de las propuestas de escritura. Sin ella el servicio NO
      # arranca: una firma con clave vacía la reproduce cualquiera, y el gate
      # quedaría decorativo. En desarrollo se fija aquí, como el resto de
      # credenciales del stack local; en producción viene del entorno con
      # `${VAR:?}`, que aborta el despliegue si falta.
      - MCP_PROPOSAL_SECRET=${MCP_PROPOSAL_SECRET:-orpycamcp_dev_proposal_secret}
      # Firma de la marca de origen del canal (AREA-11-04) y verificación de la IP real
      # que firma el gateway (AREA-11-08). Sin él, el asistente asienta canal 'api'.
      - MCP_ORIGIN_SECRET=${MCP_ORIGIN_SECRET:-orpycamcp_mcp_origin_dev}
      # STT (ADR-020): `disabled` por defecto — no hay «stub» honesto de
      # transcripción, así que sin proveedor el endpoint se NIEGA en vez de
      # aproximar lo que se dijo. `whisper` exige levantar el perfil `assistant`.
      - STT_PROVIDER=${STT_PROVIDER:-disabled}
      - WHISPER_URL=${WHISPER_URL:-http://whisper-service:8012}
      - WHISPER_INTERNAL_TOKEN=${WHISPER_INTERNAL_TOKEN:-orpycamcp_whisper_internal_dev}
    networks:
      - orpycamcp-net
    depends_on:
      - api-gateway
    restart: "no"
    mem_limit: 2g
    memswap_limit: 2g

  signature-service:
    # Firma electrónica (E06, ADR-016): sign-xml + verify; proveedor pluggable
    # ('xades_local' = XAdES-B/-T real del índice con el sello institucional
    # del tenant [Inc.1] + sello de tiempo RFC 3161 de una TSA local propia
    # del despliegue [Inc.4]; 'nativa' = HMAC de servicio, resto de objetos).
    # Contexto raíz para acceder a shared/orpycamcp_common (ADR-010, RF-FIR-14).
    build:
      context: .
      dockerfile: services/signature-service/Dockerfile
    container_name: orpycamcp-signature
    ports:
      - "127.0.0.1:19008:8008"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_APP_USER:-orpycamcp_app}:${DB_APP_PASSWORD:-orpycamcp_app}@postgres:5432/orpycamcp_db
      - MIGRATIONS_DATABASE_URL=postgresql+asyncpg://orpycamcp:orpycamcp@postgres:5432/orpycamcp_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-orpycamcp_redis_dev}@redis:6379/0
      - EVENT_SIGNING_SECRET=${EVENT_SIGNING_SECRET:-orpycamcp_event_signing_dev}
      - IDENTITY_SIGNING_SECRET=${IDENTITY_SIGNING_SECRET:-orpycamcp_identity_signing_dev}
      # Corrige puerto interno de Keycloak (era 8180, inexistente en la red) → 8080.
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=orpycamcp
      # Mismo issuer público canónico que auth-service (signature revalida el JWT
      # directamente para PERM_FIRMA — D-01).
      - KEYCLOAK_ISSUER=http://localhost:19180/realms/orpycamcp
      - SIGNATURE_SECRET=${SIGNATURE_SECRET:-change-me-in-production}
      # Sello institucional XAdES-B (RT-16, Inc.1) — ver el volumen más abajo
      # y scripts/gen-dev-signing-cert.sh para generar el par de desarrollo.
      - SIGNER_PROVIDER=${SIGNER_PROVIDER:-xades_local}
      - SIGNER_CERT_DIR=/run/secrets/signing
      # Dev-only: ./secrets/signing solo provisiona el par compartido _dev/
      # (gen-dev-signing-cert.sh), así que este entorno lo activa explícitamente.
      # NUNCA en true en producción (app/core/keys.py::load_seal) — sin esto,
      # un tenant sin sello propio falla cerrado (503) en vez de firmar con
      # una clave compartida entre tenants.
      - SIGNER_ALLOW_DEV_SEAL=${SIGNER_ALLOW_DEV_SEAL:-true}
      - STORAGE_SERVICE_URL=http://storage-service:8005
      # D-02: mismo secreto compartido que document-service/archive-service —
      # enviado por `app/clients/storage_client.py` de forma preventiva (hoy
      # solo usa `POST /upload`, que no está gateado). Dev-only.
      - STORAGE_INTERNAL_TOKEN=${STORAGE_INTERNAL_TOKEN:-orpycamcp_storage_internal_dev}
      # Sello de tiempo XAdES-T (RT-16, Inc.4) — ver el volumen más abajo y
      # scripts/gen-dev-tsa-cert.sh para generar el par de desarrollo.
      - SIGNER_TIMESTAMP_ENABLED=${SIGNER_TIMESTAMP_ENABLED:-true}
      - TSA_URL=${TSA_URL:-}
      - TSA_CERT_DIR=/run/secrets/tsa
      # Dev-only: ./secrets/tsa solo provisiona el par _dev/ (gen-dev-tsa-cert.sh),
      # así que este entorno lo activa explícitamente. NUNCA en true en
      # producción (app/core/keys.py::load_tsa_seal) — sin esto, la ausencia
      # de una TSA principal montada falla cerrado (503) en vez de sellar con
      # el par de pruebas.
      - TSA_ALLOW_DEV_SEAL=${TSA_ALLOW_DEV_SEAL:-true}
      # XAdES-LT/LTA (RT-16) — kill-switch en false por defecto: sin correr
      # scripts/gen-dev-ca.sh (que provisiona ca.crt/crl.der junto al sello
      # de _dev/), la firma se queda en XAdES-T exactamente como antes de
      # este incremento. La clave privada de la CA NUNCA se monta aquí — solo
      # ./secrets/signing (material público de la CA + sello) ya está montado
      # abajo. Ver app/core/config.py para el detalle de ambos flags.
      - SIGNER_LT_ENABLED=${SIGNER_LT_ENABLED:-false}
      - SIGNER_LT_REQUIRE=${SIGNER_LT_REQUIRE:-false}
      # OCSP stapled en XAdES-LT (RF-FIR-15) — ADITIVO a la CRL, solo tiene
      # efecto dentro del bloque LT (SIGNER_LT_ENABLED=true Y ca.crt/crl.der
      # montados). Habilitado por defecto en este entorno de desarrollo; sin
      # ocsp.crt/ocsp.key montados (scripts/gen-dev-ocsp-responder.sh) la
      # firma XAdES-LT/LTA se produce igual, solo sin OCSPValues
      # (degradación observable, firma.ocsp_downgrade_no_responder).
      - SIGNER_OCSP_ENABLED=${SIGNER_OCSP_ENABLED:-true}
      - SIGNER_OCSP_REQUIRE=${SIGNER_OCSP_REQUIRE:-false}
      # D-02: mismo secreto que archive-service.SIGNATURE_INTERNAL_TOKEN —
      # protege POST /internal/sign-indice (residual Ac. AGN 001/2024 art.
      # 4.3.2.4, reconciliación del sellado del índice). Dev-only — NUNCA
      # este valor en producción.
      - SIGNATURE_INTERNAL_TOKEN=${SIGNATURE_INTERNAL_TOKEN:-orpycamcp_signature_internal_dev}
      # Firma personal PKI por-usuario (E17/F4, Incremento 1) — llamadas
      # DIRECTAS a auth-service (Q3, mismo patrón que AUTH_SERVICE_URL del
      # 2FA OTP-correo/TOTP): POST /internal/signing-key/sign-digest. Mismo
      # secreto que auth-service.SIGNING_KEY_INTERNAL_TOKEN. Dev-only.
      - SIGNING_KEY_INTERNAL_TOKEN=${SIGNING_KEY_INTERNAL_TOKEN:-orpycamcp_signing_key_internal_dev}
      # D-02: mismo secreto que notification-service.INTERNAL_SERVICE_TOKEN —
      # enviado en X-Internal-Token al despachar el OTP de 2FA por
      # POST /api/v1/notifications/send (ahora sellado servicio-a-servicio).
      # Dev-only — NUNCA este valor en producción.
      - NOTIFICATION_INTERNAL_TOKEN=${NOTIFICATION_INTERNAL_TOKEN:-orpycamcp_notification_internal_dev}
      # E23 Inc.4: consulta de la huella VIGENTE de un borrador antes de abrir
      # el circuito y antes de resolver cualquier turno. Mismo secreto que
      # document-service.INTERNAL_SERVICE_TOKEN, que NO es el de auth-service
      # — reutilizar aquel daba 401 en cada consulta y el circuito entero
      # respondía 503 (fail-closed pero inservible). Dev-only.
      - DOCUMENT_INTERNAL_TOKEN=${DOCUMENT_INTERNAL_TOKEN:-orpycamcp_document_internal_dev}
      # AREA-04-09 Media-2: huella del índice vigente de un expediente (archive-service)
      # y del PDF vigente de un radicado (document-service, token de arriba): se
      # fija al abrir la cadena y se relee antes de cada firma. Mismo secreto que
      # archive-service.INTERNAL_SERVICE_TOKEN. Dev-only.
      - ARCHIVE_SERVICE_URL=http://archive-service:8004
      - ARCHIVE_INTERNAL_TOKEN=${ARCHIVE_INTERNAL_TOKEN:-orpycamcp_archive_internal_dev}
    volumes:
      # Solo lectura: signature-service nunca escribe en los sellos montados.
      # NUNCA se monta ./secrets/ca-authority (clave privada de la CA local de
      # desarrollo, scripts/gen-dev-ca.sh) — solo material PÚBLICO llega aquí.
      - ./secrets/signing:/run/secrets/signing:ro
      - ./secrets/tsa:/run/secrets/tsa:ro
    networks:
      - orpycamcp-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"
    mem_limit: 2g
    memswap_limit: 2g

  whisper-service:
    # Transcripción de voz EN LA PROPIA ENTIDAD (ADR-020, épica de dictado
    # soberano). Existe porque el reconocedor del navegador NO cumple la
    # decisión de soberanía: en Chrome y Edge la Web Speech API clásica manda el
    # audio a un servicio de Google, así que `VoiceInput` solo se ofrece cuando
    # el navegador reconoce en el dispositivo. Para el resto, la voz llega aquí y
    # no sale.
    #
    # ARRANCA DESACTIVADO (perfil `assistant`), como decidió ADR-020 para los
    # servicios pesados de inferencia: una instalación mínima corre sin él y sin
    # descargar ningún modelo, y `POST /api/v1/assistant/transcribe` responde 503
    # explicando cómo activarlo.
    #
    #     docker compose --profile assistant up -d whisper-service
    #
    # NO se enruta por el gateway: es interno, solo le habla el mcp-server —
    # mismo criterio que storage-service, que sirve bytes únicamente al mediador
    # de document-service (D-02). Superficie de red que nadie necesita es
    # superficie que alguien acabará usando.
    build:
      context: .
      dockerfile: services/whisper-service/Dockerfile
    container_name: orpycamcp-whisper
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-small}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cpu}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
      - WHISPER_LANGUAGE=${WHISPER_LANGUAGE:-es}
      - INTERNAL_SERVICE_TOKEN=${WHISPER_INTERNAL_TOKEN:-orpycamcp_whisper_internal_dev}
      - LOG_LEVEL=info
    volumes:
      - whisper-models:/models
    networks:
      - orpycamcp-net
    profiles:
      - assistant
    restart: unless-stopped

  knowledge-service:
    # Capa de conocimiento (E21, ADR-006): pgvector por tenant, advisoria/derivada.
    # Contexto en la raíz para incluir shared/ (ADR-010): el worker de ingesta
    # consume orpycamcp.document.events y audita con orpycamcp_common.
    build:
      context: .
      dockerfile: services/knowledge-service/Dockerfile
      args:
        # Esta máquina de desarrollo NO puede ejecutar modelos de lenguaje locales, así que
        # se omite la capa ML (torch CPU, ~1,5 GB). El Dockerfile trae WITH_ML=1 por defecto:
        # una instalación tenant local se construye completa sin tocar nada de esto.
        WITH_ML: "0"
    container_name: orpycamcp-knowledge
    ports:
      - "127.0.0.1:19011:8011"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_APP_USER:-orpycamcp_app}:${DB_APP_PASSWORD:-orpycamcp_app}@postgres:5432/orpycamcp_db
      - MIGRATIONS_DATABASE_URL=postgresql+asyncpg://orpycamcp:orpycamcp@postgres:5432/orpycamcp_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-orpycamcp_redis_dev}@redis:6379/0
      - EVENT_SIGNING_SECRET=${EVENT_SIGNING_SECRET:-orpycamcp_event_signing_dev}
      - IDENTITY_SIGNING_SECRET=${IDENTITY_SIGNING_SECRET:-orpycamcp_identity_signing_dev}
      # --- E21: proveedores, SOLO override de esta máquina de desarrollo ------------------
      # Los defaults de `app/core/config.py` siguen siendo los SOBERANOS (`local_st` +
      # `ollama_local`) y no se tocan: un despliegue tenant local no necesita ninguna de
      # estas variables. Aquí se sobreescriben porque este equipo no puede correr modelos.
      #
      # Embeddings: `stub` es un hashing vectorizer con signo sobre 384 cubetas
      # (`embeddings.py::_stub_embed`) — recuperación LÉXICA real, sin modelo ni red. Su
      # dimensión ya coincide con EMBEDDING_DIM=384 (`vector(384)` + HNSW, migración 007),
      # así que NO requiere migración. Es LOCAL/soberano
      # (`clearance.py::LOCAL_EMBEDDING_PROVIDERS`), luego el material clasificado se sigue
      # indexando. Lo que no captura son sinónimos/paráfrasis: eso lo aporta `local_st`.
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-stub}
      # Generación: Ollama Cloud (mismos parámetros que sgdINTI/ai-service). El cómputo
      # pesado sale de esta máquina. `OllamaLLMProvider` ya envía Authorization: Bearer.
      # BARRERA DURA (`clearance.py::LOCAL_LLM_PROVIDERS = {"ollama_local"}`): al ser un
      # proveedor EXTERNO, el material nivel>=RESERVADA NUNCA se le envía, sin override
      # posible. El RAG generativo responde solo sobre material público/no reservado.
      - AI_PROVIDER=${AI_PROVIDER:-ollama_cloud}
      - OLLAMA_CLOUD_URL=${OLLAMA_CLOUD_URL:-https://ollama.com}
      - OLLAMA_CLOUD_API_KEY=${OLLAMA_CLOUD_API_KEY:-}
      - MODEL_GENERATION=${MODEL_GENERATION:-gpt-oss:120b}
      # NOTA: INTERNAL_SERVICE_TOKEN se deja SIN definir a propósito ⇒ el endpoint HTTP
      # /ingest sigue fail-closed (D-02 / RF-SEG-08). La ingesta del ejemplo entra por el
      # worker event-driven (consumer de orpycamcp.document.events), que es interno y no
      # usa ese header (ver `app/services/ingestion.py`).
    networks:
      - orpycamcp-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"
    mem_limit: 2g
    memswap_limit: 2g

  auth-service:
    # Contexto en la raíz para incluir shared/ (ADR-010): el Dockerfile hace
    # COPY shared + pip install /shared. El .dockerignore de la raíz acota el contexto.
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: orpycamcp-auth
    ports:
      - "127.0.0.1:19001:8001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_APP_USER:-orpycamcp_app}:${DB_APP_PASSWORD:-orpycamcp_app}@postgres:5432/orpycamcp_db
      - MIGRATIONS_DATABASE_URL=postgresql+asyncpg://orpycamcp:orpycamcp@postgres:5432/orpycamcp_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-orpycamcp_redis_dev}@redis:6379/0
      - EVENT_SIGNING_SECRET=${EVENT_SIGNING_SECRET:-orpycamcp_event_signing_dev}
      - IDENTITY_SIGNING_SECRET=${IDENTITY_SIGNING_SECRET:-orpycamcp_identity_signing_dev}
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=orpycamcp
      # Issuer público canónico (KC_HOSTNAME_URL): los tokens los emite el
      # navegador vía localhost:19180, pero el JWKS se resuelve por keycloak:8080.
      - KEYCLOAK_ISSUER=http://localhost:19180/realms/orpycamcp
      - KEYCLOAK_CLIENT_ID=auth-service
      - KEYCLOAK_CLIENT_SECRET=change-me-in-production
      # Segundo factor (E06/F4) — clave AES-256 (base64, 32 bytes exactos) que
      # cifra en reposo el secreto TOTP de cada usuario. Estuvo AUSENTE de este
      # archivo mientras varios comentarios la nombraban como si estuviera
      # configurada: daba igual lo que se pusiera en `.env`, la variable nunca
      # entraba al contenedor y `/me/totp/enroll` devolvía un 500 opaco. Y como
      # la credencial de firma personal EXIGE un TOTP activo, con ella caía
      # también toda esa cadena. Vacía por defecto: falla cerrado, nunca deriva
      # una clave implícita. Generar con `./scripts/dev-secrets.sh`.
      - TOTP_ENCRYPTION_KEY=${TOTP_ENCRYPTION_KEY:-}
      # Firma personal PKI por-usuario (E17/F4, Incremento 1) — clave AES-256
      # (base64) que cifra en reposo la clave privada de cada usuario
      # (app/core/signing_keys.py), SEPARADA de TOTP_ENCRYPTION_KEY (arriba) y
      # del SIGNATURE_SECRET de signature-service. Vacía por defecto:
      # /me/signing-key/enroll falla cerrado (500) hasta configurarla — ver
      # services/auth-service/.env.example.
      - SIGNING_KEY_ENCRYPTION_KEY=${SIGNING_KEY_ENCRYPTION_KEY:-}
      # D-02: secreto compartido con signature-service (mismo patrón que
      # SIGNATURE_INTERNAL_TOKEN) — protege POST /internal/signing-key/*.
      # Dev-only — NUNCA este valor en producción.
      - SIGNING_KEY_INTERNAL_TOKEN=${SIGNING_KEY_INTERNAL_TOKEN:-orpycamcp_signing_key_internal_dev}
      # Anclaje de la sub-CA de usuarios (E17/F4, Incremento 2 — Baja #4):
      # SOLO el certificado PÚBLICO (ver el volumen más abajo y
      # scripts/gen-user-cert.sh, que la genera/reutiliza en
      # ./secrets/ca-authority-users y espeja SOLO ca-users.crt — NUNCA
      # ca-users.key — a ./secrets/ca-users-public). Sin este archivo
      # montado, /internal/signing-key/activate falla cerrado (503).
      - SIGNING_KEY_CA_USERS_CERT_PATH=/run/secrets/ca-users-public/ca-users.crt
    volumes:
      # Solo lectura, SOLO el cert público de la sub-CA de usuarios — la
      # clave privada (ca-users.key) vive exclusivamente en
      # ./secrets/ca-authority-users, en el host, y JAMÁS se monta en
      # ningún contenedor (ver scripts/gen-user-cert.sh).
      - ./secrets/ca-users-public:/run/secrets/ca-users-public:ro
    networks:
      - orpycamcp-net
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    restart: "no"
    mem_limit: 2g
    memswap_limit: 2g

  tenant-service:
    build:
      context: .
      dockerfile: services/tenant-service/Dockerfile
    container_name: orpycamcp-tenant
    ports:
      - "127.0.0.1:19002:8002"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_APP_USER:-orpycamcp_app}:${DB_APP_PASSWORD:-orpycamcp_app}@postgres:5432/orpycamcp_db
      - MIGRATIONS_DATABASE_URL=postgresql+asyncpg://orpycamcp:orpycamcp@postgres:5432/orpycamcp_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-orpycamcp_redis_dev}@redis:6379/0
      - EVENT_SIGNING_SECRET=${EVENT_SIGNING_SECRET:-orpycamcp_event_signing_dev}
      - IDENTITY_SIGNING_SECRET=${IDENTITY_SIGNING_SECRET:-orpycamcp_identity_signing_dev}
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=orpycamcp
    networks:
      - orpycamcp-net
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    mem_limit: 2g
    memswap_limit: 2g

  document-service:
    # Contexto en la raíz para incluir shared/ (ADR-010): el Dockerfile hace
    # COPY shared + pip install /shared. El .dockerignore de la raíz acota el contexto.
    build:
      context: .
      dockerfile: services/document-service/Dockerfile
    container_name: orpycamcp-documents
    ports:
      - "127.0.0.1:19003:8003"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_APP_USER:-orpycamcp_app}:${DB_APP_PASSWORD:-orpycamcp_app}@postgres:5432/orpycamcp_db
      - MIGRATIONS_DATABASE_URL=postgresql+asyncpg://orpycamcp:orpycamcp@postgres:5432/orpycamcp_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-orpycamcp_redis_dev}@redis:6379/0
      - EVENT_SIGNING_SECRET=${EVENT_SIGNING_SECRET:-orpycamcp_event_signing_dev}
      - IDENTITY_SIGNING_SECRET=${IDENTITY_SIGNING_SECRET:-orpycamcp_identity_signing_dev}
      - STORAGE_SERVICE_URL=http://storage-service:8005
      # D-02 (remediación no-read-up en anexos, RF-SEG-08): secreto compartido
      # que storage-service exige en X-Internal-Token para servir bytes de un
      # anexo — ver `app/clients/storage_client.py`. Dev-only; el mismo valor
      # se repite en storage-service (INTERNAL_SERVICE_TOKEN) y en
      # archive-service/signature-service más abajo. NUNCA este valor en producción.
      - STORAGE_INTERNAL_TOKEN=${STORAGE_INTERNAL_TOKEN:-orpycamcp_storage_internal_dev}
      # E10 debt (cableado del AIP OAIS al cierre del expediente): secreto que
      # ESTE servicio exige en X-Internal-Token en
      # POST /api/v1/internal/documentos/anexos — único llamador legítimo:
      # archive-service (ver el comentario en ese bloque más abajo). Dev-only.
      - INTERNAL_SERVICE_TOKEN=${DOCUMENT_INTERNAL_TOKEN:-orpycamcp_document_internal_dev}
      # E23 RF-PRO-09 (el circuito de aprobacion tiene que atar): secreto que
      # signature-service exige en X-Internal-Token en
      # GET /api/v1/signature/internal/circuitos/{tipo}/{id} — este servicio lo
      # consulta antes de aprobar un borrador, para no dejar saltar un circuito
      # de visto bueno abierto. Mismo valor que
      # signature-service.SIGNATURE_INTERNAL_TOKEN. Dev-only.
      - SIGNATURE_SERVICE_URL=http://signature-service:8008
      - SIGNATURE_INTERNAL_TOKEN=${SIGNATURE_INTERNAL_TOKEN:-orpycamcp_signature_internal_dev}
      - TENANT_SERVICE_URL=http://tenant-service:8002
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=orpycamcp
      # Custodia de las credenciales de las cuentas de correo (E19): la
      # contraseña IMAP de una cuenta institucional y el «client secret» de la
      # aplicación OAuth que la entidad registró ante Google o Microsoft. Las
      # cuentas viven en `email_cuenta`, no aquí: una fila por buzón, con su
      # responsable y su credencial cifrada.
      - EMAIL_ENCRYPTION_KEY=${EMAIL_ENCRYPTION_KEY:-}
      # Sondeo programado de buzones (E19 Increment 3). APAGADO por defecto: un
      # proceso que se conecta solo a buzones institucionales y crea documentos
      # oficiales con número inmutable no debe encenderse al desplegar. Y sin
      # `EMAIL_SONDEO_TENANT_SLUG` no arranca aunque esté activo — un sondeo que
      # adivinara la entidad radicaría en el archivo equivocado.
      - EMAIL_SONDEO_ENABLED=${EMAIL_SONDEO_ENABLED:-false}
      - EMAIL_SONDEO_TENANT_SLUG=${EMAIL_SONDEO_TENANT_SLUG:-}
      - EMAIL_SONDEO_INTERVALO_SEGUNDOS=${EMAIL_SONDEO_INTERVALO_SEGUNDOS:-300}
      # Constancia de radicación al remitente (E19): va por el `/send` sellado
      # de notification-service. El token DEBE ser el mismo que usa ese servicio.
      - NOTIFICATION_SERVICE_URL=http://notification-service:8007
      - NOTIFICATION_INTERNAL_TOKEN=${NOTIFICATION_INTERNAL_TOKEN:-orpycamcp_notification_internal_dev}
    networks:
      - orpycamcp-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"
    mem_limit: 2g
    memswap_limit: 2g

  archive-service:
    build:
      context: .
      dockerfile: services/archive-service/Dockerfile
    container_name: orpycamcp-archive
    ports:
      - "127.0.0.1:19004:8004"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_APP_USER:-orpycamcp_app}:${DB_APP_PASSWORD:-orpycamcp_app}@postgres:5432/orpycamcp_db
      - MIGRATIONS_DATABASE_URL=postgresql+asyncpg://orpycamcp:orpycamcp@postgres:5432/orpycamcp_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-orpycamcp_redis_dev}@redis:6379/0
      - EVENT_SIGNING_SECRET=${EVENT_SIGNING_SECRET:-orpycamcp_event_signing_dev}
      - IDENTITY_SIGNING_SECRET=${IDENTITY_SIGNING_SECRET:-orpycamcp_identity_signing_dev}
      # D-02: mismo secreto compartido que document-service/signature-service
      # (ver el comentario en document-service más arriba) — archive-service
      # lo usa en `app/clients/storage_client.py` para descargar el índice
      # firmado (`GET /files/{id}/download`, ahora gateado en storage-service).
      - STORAGE_INTERNAL_TOKEN=${STORAGE_INTERNAL_TOKEN:-orpycamcp_storage_internal_dev}
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=orpycamcp
      # D-02: mismo secreto que signature-service.SIGNATURE_INTERNAL_TOKEN —
      # el job de reconciliación del sellado del índice (residual Ac. AGN
      # 001/2024 art. 4.3.2.4, app/jobs/indice_reconciliation.py) lo usa para
      # llamar signature-service POST /internal/sign-indice. Dev-only.
      - SIGNATURE_INTERNAL_TOKEN=${SIGNATURE_INTERNAL_TOKEN:-orpycamcp_signature_internal_dev}
      # E10 debt (cableado del AIP OAIS al cierre del expediente): document-service
      # resuelve los file_id de los anexos de un lote de radicados —
      # app/clients/document_client.py. Mismo secreto que
      # document-service.INTERNAL_SERVICE_TOKEN más arriba. Dev-only.
      - DOCUMENT_SERVICE_URL=http://document-service:8003
      - DOCUMENT_INTERNAL_TOKEN=${DOCUMENT_INTERNAL_TOKEN:-orpycamcp_document_internal_dev}
      # E04/RF-TRD-06 R.4.8: la alerta de disposición vencida sale por correo
      # (`POST /api/v1/notifications/send`, sellado). Mismo secreto que
      # signature-service.NOTIFICATION_INTERNAL_TOKEN.
      - NOTIFICATION_SERVICE_URL=http://notification-service:8007
      - NOTIFICATION_INTERNAL_TOKEN=${NOTIFICATION_INTERNAL_TOKEN:-orpycamcp_notification_internal_dev}
      # AREA-04-09 Media-2 (ENTRANTE): signature-service resuelve en el servidor
      # la huella del índice electrónico vigente de un expediente
      # (`GET /api/v1/internal/expedientes/{ref}/indice/huella`). Mismo secreto
      # que signature-service.ARCHIVE_INTERNAL_TOKEN. Dev-only.
      - INTERNAL_SERVICE_TOKEN=${ARCHIVE_INTERNAL_TOKEN:-orpycamcp_archive_internal_dev}
    networks:
      - orpycamcp-net
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    mem_limit: 2g
    memswap_limit: 2g

  storage-service:
    # Contexto en la raíz para incluir shared/ (ADR-010): auditoría inmutable
    # orpycamcp_common (soft-delete auditado D-04).
    # target: base EXPLÍCITO (E10 Increment C2b): el Dockerfile es multi-stage
    # y el ÚLTIMO stage declarado es "production" (Java+veraPDF, ver
    # services/storage-service/Dockerfile) -- sin este target, `docker build`
    # tomaría por defecto ese último stage y dev dejaría de ser slim.
    build:
      context: .
      dockerfile: services/storage-service/Dockerfile
      target: base
    container_name: orpycamcp-storage
    ports:
      - "127.0.0.1:19005:8005"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_APP_USER:-orpycamcp_app}:${DB_APP_PASSWORD:-orpycamcp_app}@postgres:5432/orpycamcp_db
      - MIGRATIONS_DATABASE_URL=postgresql+asyncpg://orpycamcp:orpycamcp@postgres:5432/orpycamcp_db
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=orpycamcp
      - MINIO_SECRET_KEY=orpycamcp_dev
      - MINIO_USE_SSL=false
      # D-02 (remediación no-read-up en anexos, RF-SEG-08): exigido en
      # X-Internal-Token por los endpoints que sirven bytes/URL/metadata de un
      # archivo (`app/routers/storage.py::_require_internal_token`). Mismo
      # valor que STORAGE_INTERNAL_TOKEN en document/archive/signature-service.
      # Dev-only — NUNCA este valor en producción.
      - INTERNAL_SERVICE_TOKEN=${STORAGE_INTERNAL_TOKEN:-orpycamcp_storage_internal_dev}
      - IDENTITY_SIGNING_SECRET=${IDENTITY_SIGNING_SECRET:-orpycamcp_identity_signing_dev}
      # Generación del documento de salida (E23, RF-PRO-03). A diferencia de
      # veraPDF y Ghostscript —que solo van en la imagen `production`—, las
      # librerías nativas de WeasyPrint SÍ están en la imagen base, así que aquí
      # se puede encender de verdad. Sin esto, `RENDER_ENGINE` cae a "none" y
      # radicar un borrador responde 503: el circuito entero de producción
      # documental queda inalcanzable en desarrollo.
      - RENDER_ENGINE=${RENDER_ENGINE:-weasyprint}
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=orpycamcp
    networks:
      - orpycamcp-net
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    mem_limit: 2g
    memswap_limit: 2g

  workflow-service:
    # Contexto en la raíz para incluir shared/ (ADR-010): emite eventos en el
    # sobre canónico con orpycamcp_common.
    build:
      context: .
      dockerfile: services/workflow-service/Dockerfile
    container_name: orpycamcp-workflow
    ports:
      - "127.0.0.1:19006:8006"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_APP_USER:-orpycamcp_app}:${DB_APP_PASSWORD:-orpycamcp_app}@postgres:5432/orpycamcp_db
      - MIGRATIONS_DATABASE_URL=postgresql+asyncpg://orpycamcp:orpycamcp@postgres:5432/orpycamcp_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-orpycamcp_redis_dev}@redis:6379/0
      - EVENT_SIGNING_SECRET=${EVENT_SIGNING_SECRET:-orpycamcp_event_signing_dev}
      - IDENTITY_SIGNING_SECRET=${IDENTITY_SIGNING_SECRET:-orpycamcp_identity_signing_dev}
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=orpycamcp
    networks:
      - orpycamcp-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"
    # Techo de memoria: un test/worker desbocado muere por OOM del contenedor (~2 GB)
    # en vez de agotar la RAM del host.  memswap_limit = mem_limit ⇒ sin swap (evita el
    # thrashing que dejaba la máquina inusable durante minutos).
    mem_limit: 2g
    memswap_limit: 2g

  notification-service:
    # Contexto en la raíz para incluir shared/ (ADR-010): consume el sobre
    # canónico de eventos (orpycamcp.document.events) con orpycamcp_common.
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: orpycamcp-notifications
    ports:
      - "127.0.0.1:19007:8007"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_APP_USER:-orpycamcp_app}:${DB_APP_PASSWORD:-orpycamcp_app}@postgres:5432/orpycamcp_db
      - MIGRATIONS_DATABASE_URL=postgresql+asyncpg://orpycamcp:orpycamcp@postgres:5432/orpycamcp_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-orpycamcp_redis_dev}@redis:6379/0
      - EVENT_SIGNING_SECRET=${EVENT_SIGNING_SECRET:-orpycamcp_event_signing_dev}
      - IDENTITY_SIGNING_SECRET=${IDENTITY_SIGNING_SECRET:-orpycamcp_identity_signing_dev}
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_FROM=noreply@orpycamcp.local
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=orpycamcp
      # D-02: sella POST /api/v1/notifications/send (endpoint servicio-a-servicio
      # del OTP de 2FA). Mismo secreto que signature-service.NOTIFICATION_INTERNAL_TOKEN.
      # Fail-closed: vacío ⇒ /send rechaza toda llamada (401). Dev-only.
      - INTERNAL_SERVICE_TOKEN=${NOTIFICATION_INTERNAL_TOKEN:-orpycamcp_notification_internal_dev}
      # KEK que cifra en reposo el secreto HMAC de los webhooks (AES-256-GCM, base64
      # de 32 bytes). Propia de ESTE servicio, nunca en la base. El default es
      # SOLO de desarrollo; en producción es obligatoria (infra/docker-compose.prod.yml).
      # Rotación: WEBHOOK_SECRET_KEKS='{"2":"<base64>"}' + WEBHOOK_SECRET_KEK_ACTIVE_VERSION=2
      # y `python -m app.ops.rewrap_webhook_secrets` (docs/es/deployment.md).
      - WEBHOOK_SECRET_KEK=${WEBHOOK_SECRET_KEK:-FdATFrQDjvyBfvHjjZSLjrLyIQct0+dgsMz2TOycUnk=}
      - WEBHOOK_SECRET_KEKS=${WEBHOOK_SECRET_KEKS:-{}}
      - WEBHOOK_SECRET_KEK_ACTIVE_VERSION=${WEBHOOK_SECRET_KEK_ACTIVE_VERSION:-1}
    networks:
      - orpycamcp-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"
    mem_limit: 2g
    memswap_limit: 2g

  # ─── Frontend (E22) ───────────────────────────────────────────────────────────

  frontend:
    # SvelteKit 2 + Svelte 4 SSR (adapter-node). Build de producción en Docker,
    # sin bind-mount del código: no genera artefactos root en el host (.svelte-kit,
    # node_modules viven dentro de la imagen). Split de URLs público/interno:
    #   - el NAVEGADOR usa PUBLIC_* (localhost:19xxx, puertos publicados al host)
    #   - el SSR usa INTERNAL_* (nombres de servicio en la red Docker)
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: orpycamcp-frontend
    ports:
      - "19300:3000"
    environment:
      - PORT=3000
      # adapter-node limita el cuerpo a 512 KB por defecto y las subidas de anexos
      # pasan por el SSR: sin esto, todo PDF escaneado real muere en 413.
      - BODY_SIZE_LIMIT=536870912
      # Sin esto el SSR ve la IP del proxy, no la del navegador (ver Dockerfile).
      - ADDRESS_HEADER=x-forwarded-for
      - XFF_DEPTH=1
      # Origen público por el que el navegador alcanza el frontend. adapter-node
      # lo usa para derivar `url.origin` (p. ej. el redirect_uri del login PKCE).
      # Sin esto, SSR infiere el esquema/host del request y arma un redirect_uri
      # https:// que Keycloak rechaza. En prod tras TLS: ORIGIN=https://dominio,
      # o usar PROTOCOL_HEADER=x-forwarded-proto + HOST_HEADER=x-forwarded-host.
      - ORIGIN=http://localhost:19300
      # Públicas — las construye y usa el JS del navegador (login PKCE, logout).
      - PUBLIC_API_URL=http://localhost:19080
      - PUBLIC_KEYCLOAK_URL=http://localhost:19180
      # Entidad de las pantallas PÚBLICAS (ventanilla y consulta ciudadana).
      # En producción cada entidad despliega su sitio con SU slug; sin esta
      # variable las pantallas públicas se declaran no habilitadas en vez de
      # apuntar a un inquilino inventado.
      - PORTAL_TENANT_SLUG=demo
      # La política de tratamiento de datos la publica la ENTIDAD (parámetros del tenant) y
      # la sirve la ventanilla (ADR-031): ya no se configura aquí.
      # Internas — solo SSR dentro del contenedor (token exchange, userinfo,
      # back-channel logout y los proxys +server.js al gateway). Nunca llegan al cliente.
      - INTERNAL_API_URL=http://api-gateway:8080
      - INTERNAL_KEYCLOAK_URL=http://keycloak:8080
    networks:
      - orpycamcp-net
    depends_on:
      - api-gateway
      - keycloak
    restart: "no"

  # ─── Development Tools ────────────────────────────────────────────────────────

  # Mailpit (sucesor mantenido de MailHog, abandonado desde 2020). Tag y digest
