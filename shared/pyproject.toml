[project]
name = "orpycamcp-common"
version = "0.1.0"
description = "Utilidades compartidas de OrpycaMCP: auditoría inmutable (audit_log encadenado por hash) y sobre canónico de eventos Redis Streams. Ver ADR-010."
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    # `request_log` es middleware ASGI (11.2). Starlette ya viene con FastAPI en
    # los once servicios, pero declararlo es lo que permite que el linter y los
    # tests de esta librería lo verifiquen de verdad en vez de colapsarlo a `Any`.
    "starlette>=0.37.0",
]

# `orpycamcp_common.kek` (AES-256-GCM con AAD) necesita `cryptography`. Es un
# extra y no una dependencia base a propósito: solo lo importan los servicios que
# custodian secretos en reposo (auth, notification), que ya lo declaran en su
# propio requirements; los demás no deben cargar con él.
[project.optional-dependencies]
kek = ["cryptography>=42.0.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["orpycamcp_common"]

# PEP 561: sin este marcador, mypy trata el paquete como NO tipado aunque esté
# instalado, y con `--ignore-missing-imports` lo colapsa entero a `Any`. Es decir:
# `audit.append(...)` —el asiento inmutable del que depende la trazabilidad legal—
# se verificaba en los once servicios contra una firma inexistente. Instalar la
# librería en el linter no basta; hace falta declararla tipada.
[tool.setuptools.package-data]
orpycamcp_common = ["py.typed"]
