<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Docuboto — Sistema de Gestión Documental Electrónico de Archivo (SGDEA)"
    />
    <!--
      Verde de marca 600: es el que tiñe la barra del navegador en Android y la
      barra de estado en iOS. Se escribe literal a propósito — la etiqueta la lee
      el navegador antes de que exista hoja de estilo alguna, así que no puede
      resolver `var(--op-primary-dark)`. Si cambia el token, cambia aquí.
    -->
    <meta name="theme-color" content="#1c6b33" />
    <meta property="og:title" content="Docuboto — Sistema de Gestión Documental" />
    <meta
      property="og:description"
      content="Sistema de Gestión Documental Electrónico de Archivo (SGDEA) libre, conforme a la Ley 594 de 2000."
    />
    <meta property="og:image" content="%sveltekit.assets%/brand/orpyca-lockup.png" />
    <meta property="og:type" content="website" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
